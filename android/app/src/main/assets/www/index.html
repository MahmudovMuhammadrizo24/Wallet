<style>
/* Hamyon v10: to'q ko'k asos + havorang (navigatsiya, havola, fokus) + sariq (asosiy amal).
   Har bir rang bir marta, light-dark(och, qorong'i) ko'rinishida yoziladi. Mavzu: tizim / och / qorong'i. */
:root{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
:root{
--coin-btc:#f7931a;--coin-eth:#7c93f0;--coin-usdt:#2fb386;--coin-trx:#f0605a;--coin-sol:#a874ff;--coin-ton:#38a8ee;--coin-usdc:#2775ca;--coin-dai:#f4b731;--coin-other:#9aa3b8;
  --bg:light-dark(#eef5fd,#08111f);--card:light-dark(#ffffff,#0f1c31);--s2:light-dark(#e3eefb,#172a47);
  --inp:light-dark(#ffffff,#0b1626);--line:light-dark(#cfdef0,#213554);--bd:light-dark(#6f86a6,#5d7aa3);
  --txt:light-dark(#0a1a33,#eaf2ff);--mut:light-dark(#465b7a,#9db2d0);
  --acc:#ffc72c;--on-acc:light-dark(#0a1a33,#08111f);
  --sky:light-dark(#0b63b8,#5ccbff);--lnk:var(--sky);--focus:var(--sky);
  --up:light-dark(#0a6a38,#4fd18b);--down:light-dark(#b3261e,#ff8a8a);--ok:var(--up);
  --warn-bg:light-dark(#fff4cc,#2a2410);--warn-bd:light-dark(#e8c64a,#6b5a14);--warn-tx:light-dark(#5a4200,#ffe08a);
  --dng-bg:light-dark(#fde8e8,#3b1b26);--dng-tx:light-dark(#9b1c1c,#ff9aa2);
  --shadow:0 8px 28px light-dark(rgba(15,50,100,.14),rgba(0,0,0,.5));
  --hero:linear-gradient(150deg,light-dark(#d3eaff,#12305c) 0%,light-dark(#fff6d6,#0b1a30) 64%);
  --r:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo{width:34px;height:34px;flex:none;display:block}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{background:var(--acc);color:var(--on-acc);border:0;border-radius:12px;padding:10px 16px;font:600 15px/1.2 inherit;cursor:pointer;min-height:44px}
button:active{transform:scale(.98)}
@media (hover:hover){button:not(:disabled):hover{filter:brightness(1.1)}button.sec:not(:disabled):hover{background:color-mix(in srgb,var(--txt) 10%,var(--s2));filter:none}}
button[aria-busy=true]{position:relative;color:transparent;pointer-events:none}
button[aria-busy=true]::after{content:'';position:absolute;inset:0;margin:auto;width:18px;height:18px;border:2px solid var(--on-acc);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
button.sec[aria-busy=true]::after{border-color:var(--txt);border-top-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){button[aria-busy=true]::after{animation-duration:2s}}
.w100{width:100%}.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt14{margin-top:14px}.mt16{margin-top:16px}
button.sec,.btn.sec{background:var(--s2);color:var(--txt);font-weight:500}
button.danger{background:var(--dng-bg);color:var(--dng-tx);font-weight:500}
button.sm{padding:6px 12px;font-size:14px;min-height:36px;border-radius:12px}
button:disabled{opacity:.55;cursor:not-allowed}
.ib{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--s2);color:var(--txt);border-radius:16px}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input,select{width:100%;background:var(--inp);color:var(--txt);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;font-size:16px;min-height:44px}
input::placeholder{color:var(--mut);opacity:.8}
label{display:block;color:var(--mut);font-size:14px;margin:12px 0 5px}
.mut{color:var(--mut);font-size:14px}
.up{color:var(--up)}.down{color:var(--down)}
.hero{position:relative;overflow:hidden;background:var(--hero);border-color:color-mix(in srgb,var(--sky) 38%,var(--line));box-shadow:var(--shadow)}
.hero>*{position:relative}
.total{font-size:40px;font-weight:700;letter-spacing:-.03em;margin:2px 0 0;line-height:1.1}
.bar{display:flex;height:8px;border-radius:8px;overflow:hidden;background:color-mix(in srgb,var(--txt) 10%,transparent);margin:14px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.actions button{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:72px;padding:10px 4px;font-size:14px;font-weight:600;background:var(--s2);color:var(--txt)}
.actions button .ai{width:36px;height:36px;border-radius:12px;background:var(--acc);color:var(--on-acc);display:flex;align-items:center;justify-content:center}
.actions svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.assets{padding:6px 14px}
table{width:100%;border-collapse:collapse}
thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
tbody,table{display:block}
tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
tr:last-child{border-bottom:0}
td{display:block;border:0;padding:0}
.a-id{grid-column:1;grid-row:1/3;display:flex;gap:12px;align-items:center;min-width:0}
.ci{flex:none;width:42px;height:42px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;background:var(--s2);background:color-mix(in srgb,var(--c) 18%,transparent);color:light-dark(color-mix(in srgb,var(--c) 62%,#000),var(--c))}
.a-t{display:flex;flex-direction:column;min-width:0}
.a-n{font-weight:600;overflow-wrap:anywhere}
.a-s{font-size:14px;color:var(--mut)}
.a-q{grid-column:2;grid-row:1;text-align:right;font-weight:700;font-size:16px}
.a-m{grid-column:2;grid-row:2;text-align:right;font-size:14px;color:var(--mut)}
.a-x{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.a-addr{font-size:12px;color:var(--mut)}
.a-b{display:flex;gap:6px}
.ng{padding:18px 0 4px;border-bottom:0;align-items:baseline}
tr:has(+ .ng){border-bottom:0}
.ng:first-child{padding-top:6px}
.ng th{grid-column:1;text-align:left;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.ng th .nc{font-weight:500;text-transform:none;letter-spacing:0;margin-left:6px}
.ng td{grid-column:2;text-align:right;font-size:13px;font-weight:600;color:var(--mut)}
.pgh{margin:14px 0 0;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.pgh:first-child{margin-top:2px}
.ngp-row{border-bottom:0;padding:2px 0 8px}
.ngp-row td{grid-column:1/-1}
tr:has(+ .ngp-row){border-bottom:0}
.ngp{min-height:40px;font-size:14px;color:var(--mut)}
.tag{display:inline-block;background:var(--s2);border-radius:8px;padding:1px 7px;font-size:12px;font-weight:600;color:var(--mut);margin-left:7px;vertical-align:1px}
.empty{text-align:center;padding:22px 8px}
.empty strong{display:block;font-size:16px;margin-bottom:6px}
.empty p{margin:0 0 14px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grid{grid-template-columns:1fr}.words{grid-template-columns:repeat(2,1fr)}.total{font-size:32px}}
.center{max-width:440px;margin:6vh auto 0}
.center .brand{margin-bottom:6px}
.center .tagline{color:var(--mut);font-size:14px;margin:0 0 4px}
.tabs{display:flex;gap:4px;background:var(--inp);border:1px solid var(--line);border-radius:16px;padding:4px;margin:14px 0}
.tab{flex:1;background:transparent;color:var(--mut);padding:9px 6px;font-weight:600;border-radius:12px;min-height:44px}
.tab.on{background:var(--acc);color:var(--on-acc)}
.picklist{display:grid;gap:8px;margin-top:10px}
.pk{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--s2);color:var(--txt);border:1px solid var(--line);min-height:56px;padding:10px 14px;font-weight:500}
.pk:disabled{opacity:.55;cursor:not-allowed}
.pk-b{color:var(--mut);font-size:14px;white-space:nowrap}
#pick-close{min-height:44px;min-width:44px}
.words{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.w{position:relative}
.w span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:12px;pointer-events:none}
.w input{padding:10px 20px 10px 26px;font-size:16px}
.w input.ok{border-color:var(--ok)}
.w input.bad{border-color:var(--down)}
.vgrid{display:grid;gap:10px;margin:12px 0}
.seg{display:flex;gap:6px;margin-top:6px}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.msg{margin-top:10px;font-size:14px;color:var(--warn-tx);min-height:20px}
.warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx);border-radius:12px;padding:11px 12px;font-size:14px;margin:12px 0}
.w.ok::after,.w.bad::after{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:700;pointer-events:none}
.w.ok::after{content:'\2713';color:var(--ok)}
.w.bad::after{content:'\2715';color:var(--down)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.addrfull{font:600 14px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--inp);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx);border-radius:12px;padding:10px 14px;font-size:14px;max-width:92vw;z-index:60;box-shadow:var(--shadow)}
.modal-bg{position:fixed;inset:0;background:rgba(4,9,18,.74);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;max-width:400px;width:100%;box-shadow:var(--shadow)}
.modal p{margin:0 0 12px}
.modal .btns{margin-top:14px;justify-content:flex-end}
.inrow{display:flex;gap:8px;align-items:center}.inrow input{flex:1}
.rv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;margin:12px 0}.rv dt{color:var(--mut);font-size:14px}.rv dd{margin:0;word-break:break-word}
.chk{display:flex;gap:10px;align-items:flex-start;color:var(--txt);font-size:14px;margin:12px 0;cursor:pointer}.chk input{width:auto;min-height:0;margin-top:3px}
.hist{list-style:none;margin:10px 0;padding:0}.hist li{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line)}
.hist .amt{font-weight:600}
a.lnk{color:var(--lnk)}
#recv-qr{width:220px;max-width:100%;margin:12px auto}#recv-qr svg{display:block;width:100%;height:auto;border-radius:12px;background:#fff;padding:8px}
details{border-top:1px solid var(--line);padding:4px 0}summary{cursor:pointer;padding:12px 0;font-weight:600;min-height:44px}
details ol,details ul{padding-left:20px;margin:4px 0 10px}details li{margin:6px 0}details p{margin:6px 0 10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav button{background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:12px;font-weight:600;min-height:56px;border-radius:16px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current=page]{color:var(--txt);background:var(--s2)}
.nav button[aria-current=page] svg{stroke:var(--sky)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}button:active{transform:none}}

.appbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 -16px 10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ab-l{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.appbar .btns{flex-wrap:nowrap;flex:none}
.ab-title{font-weight:700;font-size:16px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page{animation:pageIn .22s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:6px 2px 14px;outline:none}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 10px}
.sect h2{margin:0}
.more{font-size:14px;font-weight:600;color:var(--lnk);text-decoration:none;padding:8px 4px}
.mini{list-style:none;margin:0;padding:0}
.mini li+li{border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 0;color:inherit;text-decoration:none;min-height:64px}
.mrow .a-q{grid-column:3;grid-row:auto;text-align:right;font-weight:700}
.mrow .a-t{grid-column:2}
.mrow .ci{grid-column:1}
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.rowlink{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 16px;color:var(--txt);text-decoration:none;min-height:68px}
.group .rowlink+.rowlink{border-top:1px solid var(--line)}
.rowlink:hover{background:color-mix(in srgb,var(--txt) 5%,transparent)}
.rowlink .ri{width:42px;height:42px;border-radius:16px;background:var(--s2);color:var(--sky);display:flex;align-items:center;justify-content:center}
.rowlink .ri svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rowlink b{display:block;font-weight:600}
.rowlink small{display:block;color:var(--mut);font-size:14px}
.rowlink .ch{color:var(--mut);width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tipcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
[hidden]{display:none!important}
#theme-seg button{flex:1}
.ct-list{list-style:none;margin:0;padding:0}
.ct{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ct:last-child{border-bottom:0}
.ct b{display:block;overflow-wrap:anywhere}
#bar:empty,#legend:empty{display:none}
.sm.danger{min-width:44px}
/* v22: UI takomillashtirish. Sariq = sahifadagi yagona asosiy amal; faol holat = havorang. */
.nav{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{gap:2px;font-weight:500;color:var(--mut);min-height:60px;padding:4px}
.nav button svg{box-sizing:content-box;width:22px;height:22px;padding:4px 17px;border-radius:15px}
.nav button[aria-current=page]{background:transparent;color:var(--sky);font-weight:700}
.nav button[aria-current=page] svg{background:color-mix(in srgb,var(--sky) 16%,transparent);stroke:var(--sky);stroke-width:2.2}
.tabs{background:var(--s2);border-color:transparent}
.tab.on{background:var(--card);color:var(--sky);font-weight:700;box-shadow:0 1px 3px light-dark(rgba(15,50,100,.18),rgba(0,0,0,.5))}
.actions button{background:color-mix(in srgb,var(--sky) 12%,var(--card))}
.actions button .ai{background:var(--s2);color:var(--sky)}
.actions #act-send .ai{background:var(--acc);color:var(--on-acc)}
.a-b{align-items:center}
.a-b .sm{min-height:44px;min-width:44px}
button.danger.sm[data-act=del]{background:transparent;color:var(--mut);padding:0;display:inline-flex;align-items:center;justify-content:center}
button.danger.sm[data-act=del]:hover{color:var(--dng-tx);background:var(--dng-bg)}
.ngb{background:transparent;color:var(--lnk);display:flex;align-items:center;justify-content:flex-start;gap:8px;width:100%;min-height:48px;padding:0 4px;font-weight:600;font-size:14px}
.ngb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
#recv-copy{width:100%;min-height:52px;font-weight:700}
.qrv{width:100%;max-height:52vh;object-fit:cover;border-radius:16px;background:#000}
#ng-msg:empty{display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(4,9,18,.6);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--txt);width:100%;max-width:560px;max-height:82vh;border-radius:24px 24px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);animation:sheetUp .2s ease both}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{margin:0}
.sheet-l{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
.sheet-l li{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid var(--line)}
.sheet-l li:last-child{border-bottom:0}
.sheet-l .a-t{flex:1}
.sheet-l button{min-width:88px}
/* v23 */
.ngh{background:transparent;color:inherit;display:flex;align-items:center;gap:6px;padding:0;min-height:44px;font:inherit;letter-spacing:inherit;text-transform:inherit;font-weight:700;border-radius:8px;text-align:left}
.ngh svg{flex:none;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.ngh[aria-expanded=false] svg{transform:rotate(-90deg)}
.ng-hide{display:none!important}
.ng:has(.ngh){padding-top:8px;padding-bottom:0}
#theme-seg{background:var(--s2);border-radius:16px;padding:4px;gap:4px;margin-top:0}
#theme-seg button{min-height:44px;background:transparent;color:var(--mut);font-weight:600}
#theme-seg button[aria-pressed=true]{background:var(--card);color:var(--sky);font-weight:700;box-shadow:0 1px 3px light-dark(rgba(15,50,100,.18),rgba(0,0,0,.5))}
.pgh.st{margin:18px 2px 8px}
.pgh.st:first-of-type{margin-top:4px}
@media (prefers-reduced-motion:reduce){.ngh svg{transition:none}}
/* v26: dizayn (Hamyon UI takomillashtirish) bo'yicha */
.more{display:inline-flex;align-items:center;min-height:44px;min-width:44px}
button.sm{min-height:44px;min-width:44px}
.back,#back,.ib{flex:none;min-width:44px}
.appbar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
.appbar .ib{background:var(--card);border:1px solid var(--line);border-radius:14px}
.logo{border-radius:10px}
.hero{background:linear-gradient(160deg,#0b63b8,#0a3f7a);color:#fff;border:0;border-radius:24px;padding:20px 18px;box-shadow:0 10px 28px rgba(10,63,122,.28)}
.hero .mut,.hero .legend{color:rgba(255,255,255,.86)}
.hero .total{color:#fff;font-size:34px;overflow-wrap:anywhere}
.hero #status{font-size:12px}
.ngh .nc{display:none}
@media(min-width:480px){#list tr.ng .ngh .nc{display:inline}}
#list tr.ng .ngh{white-space:nowrap}
.hchg{font-weight:600;font-size:14px;color:#fff;margin-top:2px}
.hero .bar{background:rgba(255,255,255,.18)}
.hero .actions button{background:rgba(255,255,255,.16);color:#fff;border-radius:16px}
.hero .actions button .ai{background:rgba(255,255,255,.2);color:#fff}
.hero .actions #act-send{background:var(--acc);color:#0a1a33}
.hero .actions #act-send .ai{background:rgba(10,26,51,.12);color:#0a1a33}
.ph-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 12px}
.ph-row .ph{margin:0}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:22px;background:var(--acc);color:var(--on-acc);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:14px;font-weight:500}
.chip[aria-pressed=true]{background:var(--sky);border-color:var(--sky);color:#fff;font-weight:600}
#pg-assets .assets{padding:0;background:transparent;border:0}
#pg-assets table,#pg-assets tbody{display:block}
#list{display:block}
#list tr{display:block;border:0;padding:0}
#list tr.ng{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:6px 14px;margin:12px 0 0}
#list tr.ng:first-child{margin-top:0}
#list tr.ng:has(+ tr.ng),#list tr.ng:has(+ .ng-hide),#list tr.ng:last-child{border-bottom:1px solid var(--line);border-radius:20px}
#list tr.ng th{flex:1;min-width:0;padding:0;font-weight:700;text-transform:none;letter-spacing:0;font-size:15px;color:var(--txt)}
#list tr.ng td{font-weight:700;font-size:15px;padding:0;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
#list tr.ng .ngh{width:100%;gap:8px;text-transform:none;letter-spacing:0;font-size:15px;color:var(--txt)}
#list tr.ng .ngh .gi{flex:none;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:color-mix(in srgb,var(--c) 30%,transparent);color:light-dark(color-mix(in srgb,var(--c) 55%,#000),var(--c))}
#list tr.ng .ngh .nc{font-weight:500;color:var(--mut);margin-left:2px;font-size:13px;white-space:nowrap}
#list tr.ar{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;background:var(--card);border:solid var(--line);border-width:0 1px;padding:0 4px 0 0}
#list tr.ar td{padding:0}
#list tr.ar + tr.ar{border-top:1px solid var(--s2)}
#list tr.ar:has(+ tr.ng),#list tr.ar:last-child{border-bottom:1px solid var(--line);border-radius:0 0 20px 20px}
#list .rowbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:0 8px 0 14px;background:transparent;color:var(--txt);text-align:left;border-radius:0;font:inherit;font-weight:400}
#list .rowbtn .a-t{flex:1;min-width:0}
#list .rowbtn .a-n{font-weight:600;font-size:15px;overflow-wrap:anywhere}
#list .rowbtn .a-m{font-size:13px;color:var(--mut);display:block;text-align:left;margin:0;overflow-wrap:anywhere}
#list .rowbtn .a-r{display:flex;flex-direction:column;align-items:flex-end;flex:none;max-width:48%;text-align:right}
#list .rowbtn .a-q{font-weight:700;font-size:15px;overflow-wrap:anywhere;margin:0}
#list .rowbtn .a-s{font-size:12px}
#list .ib.rm{background:transparent;border:0;color:var(--mut)}
#list tr.ngp-row{display:block;background:var(--card);border:1px solid var(--line);border-top:1px solid var(--s2);border-radius:0 0 20px 20px;padding:0 10px}
#list tr.ngp-row td{padding:0}
#list tr.ng + tr.ngp-row{border-top:0}
#list tr.ng:has(+ tr.ngp-row){border-radius:20px 20px 0 0}
#list tr.ng-hide{display:none!important}
.mrow .a-t{min-width:0}
.mrow .a-n{font-weight:600}
.mrow .a-r{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.mrow .a-s{font-size:13px}
.mrow{grid-template-columns:auto minmax(0,1fr) auto}
.mrow .a-r{max-width:62vw;min-width:0}
.mrow .a-t{overflow-wrap:anywhere}
.mrow .a-q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dhero{display:flex;align-items:center;gap:14px;margin:4px 2px 14px}
.dhero .ci{width:56px;height:56px;border-radius:50%;font-size:26px}
.dhero .dh-t{min-width:0}
.dhero .ph{margin:0;font-size:15px;font-weight:600;color:var(--mut);letter-spacing:0}
.dh-b{font-size:26px;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.dact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 6px}
.dact button{min-height:52px;border-radius:26px;font-size:15px;font-weight:700}
.dact .sec{background:var(--card);border:1.5px solid var(--sky);color:var(--sky)}
#recv-copy{background:var(--sky);color:#fff;border-radius:26px}
#recv-qr{background:#fff;border-radius:20px;padding:14px;border:1px solid var(--line);display:flex;justify-content:center}
#recv-addr{background:var(--s2);border-radius:14px;padding:12px 14px}
.sd-asset{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;min-height:64px;margin-bottom:6px}
.sd-asset .a-t{flex:1;min-width:0}
.fld{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 6px 0 14px;min-height:52px;gap:6px}
.fld input{flex:1;min-width:0;border:0!important;outline:none;background:transparent!important;min-height:44px;padding:0!important;font-size:15px;box-shadow:none!important}
.fld:focus-within{border-color:var(--sky)}
.fld .ib{background:var(--bg);border-radius:12px;color:var(--sky);padding:0}
.fld .unit{font-weight:600;font-size:14px;color:var(--mut)}
#sd-amt{font-size:20px!important;font-weight:600}
#sd-max{background:color-mix(in srgb,var(--sky) 16%,var(--card));color:var(--sky);border-radius:12px;font-weight:700;font-size:14px;padding:0 14px}
#sd-speed{background:var(--s2);border-radius:16px;padding:4px;gap:4px}
#sd-speed button{flex:1;background:transparent;color:var(--mut);border-radius:12px;font-weight:600;font-size:14px}
#sd-speed button[aria-pressed=true]{background:var(--card);color:var(--sky);font-weight:700;box-shadow:0 1px 3px light-dark(rgba(15,50,100,.18),rgba(0,0,0,.5))}
#sd-next{width:100%;min-height:56px;border-radius:28px;font-size:16px;font-weight:700;margin-top:6px}
#sd-form .mut{font-size:13px}
#add button[type=submit]{min-height:54px;border-radius:27px;font-size:16px;font-weight:700}
#add input,#add select{background:var(--card);border:1.5px solid var(--line);border-radius:14px;min-height:52px}
.row-sheet button.rs{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;background:transparent;color:var(--txt);font-weight:600;font-size:16px;text-align:left;border-radius:14px;padding:0 8px}
.row-sheet button.rs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row-sheet button.rs.dng{color:var(--dng-tx)}
.warn.lim{background:#fde8e6;border:1px solid #f0b3ae;color:#7a1610;font-weight:600}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .warn.lim{background:#3a1512;border-color:#7a2a24;color:#ffd7d3}}
:root[data-theme=dark] .warn.lim{background:#3a1512;border-color:#7a2a24;color:#ffd7d3}
#pg-add .addtk{background:transparent;border:0;padding:0;box-shadow:none}
.addtk .step{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
.addtk .stl{font-size:14px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;padding:6px 4px;text-align:center}
.tile .ti{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--c) 30%,transparent);color:light-dark(color-mix(in srgb,var(--c) 55%,#000),var(--c))}
.tile[aria-checked=true]{border:2px solid var(--sky);background:var(--s2);color:var(--sky);font-weight:700;padding:5px 3px}
.addlist{background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.addrow{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 16px;border:0;border-bottom:1px solid var(--s2);background:transparent;color:var(--txt);text-align:left;width:100%;font:inherit;border-radius:0}
.addrow:last-child{border-bottom:0}
.addrow .a-t{flex:1;min-width:0}
.addrow .a-n{font-weight:600;font-size:15px;display:block}
.sr select{min-width:44px;min-height:44px}
.addrow .a-s{font-size:13px;color:var(--mut);display:block}
.addrow .st{font-size:13px;font-weight:600;color:var(--sky);white-space:nowrap}
.addrow[aria-pressed=true]{background:var(--s2)}
.addrow[aria-pressed=true] .st{font-weight:700}
.addrow.done{cursor:default}
.addrow.done .st{color:var(--ok-tx,#0f6b46)}
.addrow.nob .st{color:var(--mut)}
#tk-add{width:100%;min-height:54px;border-radius:27px;font-size:16px;font-weight:700;margin-top:12px}
.addtk .lnk{background:transparent;color:var(--sky);min-height:44px;font-weight:700;width:100%;margin-top:4px}
/* Kirish ekrani (dizayn: Boshlash) */
.logo{border-radius:0}
.authhero{margin:-16px -16px 8px;padding:32px 20px 24px;border-radius:var(--r) var(--r) 28px 28px;background:linear-gradient(160deg,#0b63b8,#0a3f7a);color:#fff;text-align:center}
.authhero .logo{width:84px;height:84px;margin:0 auto 14px}
.authhero .logo>rect:first-of-type{fill:#fff;fill-opacity:.16}
.authhero h1{color:#fff;font-size:26px;font-weight:800;margin:0 0 6px}
.authhero .tagline,.center .authhero .tagline{color:rgba(255,255,255,.92);font-size:15px;margin:0}
#pg-security .card h3{display:flex;align-items:center;gap:8px}
/* Veb (desktop) maketi: faqat keng ekranda */
.nav .dk{display:none}
.hm-l,.hm-r,.hm-t{display:contents}
@media (min-width:1024px){
  .wrap{max-width:none;margin:0;padding:20px 40px 48px;margin-left:calc(248px + max(0px,(100vw - 248px - 1160px) / 2));margin-right:max(0px,(100vw - 248px - 1160px) / 2);max-width:1160px}
  .nav{top:0;right:auto;bottom:0;width:248px;border-top:0;border-right:1px solid var(--line);padding:20px 12px;background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}
  .nav-in{max-width:none;height:100%;display:flex;flex-direction:column;gap:4px;align-content:start}
  .nav .dk{display:flex}
  .nav-brand{align-items:center;gap:10px;padding:4px 6px 18px;font-weight:800;font-size:16px;white-space:nowrap;color:var(--txt)}
  .nav-brand .logo{width:36px;height:36px;flex:none}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:0 14px;font-size:15px;font-weight:600;border-radius:14px;width:100%}
  .nav button svg{box-sizing:content-box;width:22px;height:22px;padding:0;border-radius:0}
  .nav button:hover{background:var(--s2)}
  .nav button[aria-current=page]{background:var(--s2);color:var(--sky);font-weight:700}
  .nav-sp{flex:1;min-height:8px}
  #brand{display:none}
  .appbar{margin:0 -40px 12px;padding:10px 40px}
  .toast{left:calc(50% + 124px);bottom:24px}
  #pg-home:not([hidden]){display:grid;grid-template-columns:minmax(360px,5fr) minmax(0,7fr);gap:0 24px;align-items:start}
  .hm-l{display:block;grid-column:1;grid-row:1}
  .hm-t{display:block;grid-column:1;grid-row:2}
  .hm-r{display:block;grid-column:2;grid-row:1 / span 2}
  #pg-home .total{font-size:44px}
  #pg-settings,#pg-backup,#pg-wallets,#pg-add,#pg-contacts,#pg-mining,#recv,#pick{max-width:760px}
  #pg-security:not([hidden]){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 20px;align-items:start}
  #pg-security>:not(.card){grid-column:1 / -1}
  #px-list{display:grid;grid-template-columns:1fr 1fr}
  #px-list li:nth-last-child(2):nth-child(odd){border-bottom:0}
  .center{max-width:480px;margin-top:8vh}
}
/* Narxlar sahifasi */
#as-px{display:inline-flex;align-items:center;min-height:44px;min-width:44px;font-weight:600}
.pxbar{display:flex;gap:8px;align-items:center;margin:0 0 12px}
.pxbar input{flex:1;min-width:0;min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:0 16px;font:inherit}
.pxlist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.pxlist li{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 16px;border-bottom:1px solid var(--s2)}
.pxlist li:last-child{border-bottom:0}
.pxlist .px-t{flex:1;min-width:0}
.pxlist .px-n{font-weight:600;font-size:15px;display:block}
.pxlist .px-s{font-size:13px;color:var(--mut);display:block}
.pxlist .px-v{text-align:right;font-weight:700;font-size:15px}
.pxlist .px-c{display:block;font-size:13px;font-weight:600}
.pxlist .ci{flex:none}
/* Mining sahifasi */
.card .sect{align-items:center;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;align-items:end}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--s2);border-radius:16px;padding:12px;min-width:0}
.stat.w2{grid-column:1/-1}
.stat .k,.stat .s{display:block;color:var(--mut);font-size:12px}
.stat .v{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;margin:2px 0}
.stat .bar{height:6px;margin:10px 0 2px}
.spark{display:block;width:100%;height:56px;margin-top:10px}
.spark path{fill:none;stroke:var(--sky);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.spark .ar{fill:color-mix(in srgb,var(--sky) 16%,transparent);stroke:none}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 12px;margin:16px 0 0}
.kv dt{color:var(--mut);font-size:14px}
.kv dd{margin:0;text-align:right;font-weight:600}
.kv .big{font-size:24px;font-weight:700}
input[aria-invalid=true]{border-color:var(--down)}

</style>

function btcRateFor(fees, speed) {
  const pick = ks => { for (const k of ks) if (fees && fees[k] > 0) return fees[k]; return null; };
  const r = speed === 'fast' ? pick(['1', '2', '3']) : speed === 'slow' ? pick(['12', '24', '144']) : pick(['3', '4', '6']);
  if (r === null) throw new Error('Komissiya stavkasi olinmadi.');
  return Math.max(1, Math.ceil(r * 100) / 100);
}

async function prepETH(it, to, amtStr, speed) {

  if (Object.values(ERC20).some(x => x.addr.toLowerCase() === ti.address.toLowerCase())) throw new Error('Bu token shartnomasining o\'z manzili. Unga yuborsangiz, pul qaytmaydi.');

  const pad = a => a.toLowerCase().replace('0x', '').padStart(64, '0');

    rpc(N.rpc, 'eth_getTransactionCount', [it.address, 'pending']),
    rpc(N.rpc, 'eth_getBlockByNumber', ['latest', false]),
    rpc(N.rpc, 'eth_maxPriorityFeePerGas', []).catch(() => null),
    rpc(N.rpc, 'eth_getBalance', [it.address, 'latest']),
    isTok ? rpc(N.rpc, 'eth_call', [{ to: T.addr, data: '0x70a08231' + pad(it.address) }, 'latest']) : Promise.resolve(null)

  const maxFee = base * 2n + tip;

    if (!tokenAmt || tokenAmt <= 0n) throw new Error('Summa noto\'g\'ri yoki balans 0.');
    if (tokenAmt > tokBal) throw new Error(T.sym + ' balansi yetarli emas (bor: ' + fmtUnits(tokBal, T.dec) + ' ' + T.sym + ').');
  } else if (!max) {

    if (value > ethBal) throw new Error(N.nat + ' balansi yetarli emas (bor: ' + fmtUnits(ethBal, 18) + ' ' + N.nat + ').');
  }
  const data = isTok ? WL.erc20Data(ti.address, tokenAmt) : '0x';
  const target = isTok ? T.addr : ti.address;
  let gas;
  try {
    gas = BigInt(await rpc(N.rpc, 'eth_estimateGas', [{ from: it.address, to: target, value: '0x' + (isTok ? 0n : (max ? 1n : value)).toString(16), data }]));
  } catch (e) { throw new Error('Tranzaksiya bajarilmasligi aniqlandi: ' + errText(e)); }

  const warnings = [];

    const [code, nn, rb] = await Promise.all([rpc(N.rpc, 'eth_getCode', [ti.address, 'latest']), rpc(N.rpc, 'eth_getTransactionCount', [ti.address, 'latest']), rpc(N.rpc, 'eth_getBalance', [ti.address, 'latest'])]);
    if (code && code !== '0x') warnings.push('Qabul qiluvchi manzil smart-kontrakt. Oddiy hamyon yoki birja depozit manzili bo\'lishi kerak bo\'lsa, bu noto\'g\'ri manzil: kontraktga yuborilgan pul qaytmasligi mumkin.');
    else if (BigInt(nn) === 0n && BigInt(rb) === 0n) warnings.push('Bu manzil ' + N.name + ' tarmog\'ida hali hech qachon ishlatilmagan (' + N.nat + ' balansi ham, tranzaksiyasi ham yo\'q). Yangi hamyon bo\'lmasa, manzilda xato bo\'lishi mumkin.');

  if (isTok) warnings.push(N.id === 1 ? 'Faqat Ethereum (ERC-20) tarmog\'idagi ' + T.sym + ' yuboriladi. Qabul qiluvchi manzil ham shu tarmoqda bo\'lishi shart (Tron yoki BSC manzili emas).' : 'Faqat ' + N.name + ' tarmog\'idagi ' + T.sym + ' yuboriladi. Qabul qiluvchi manzil ham shu tarmoqda bo\'lishi shart: boshqa tarmoqdagi (Ethereum, Tron va h.k.) manzilga yuborsangiz, pul qaytmasligi mumkin.');

  if (N.id === 1 && feeMax > 5n * 10n ** 15n) warnings.push('Komissiya (eng ko\'pi bilan) ' + fmtUnits(feeMax, 18) + ' ETH: bu odatdagidan ancha yuqori. Summadan qat\'i nazar, buni tekshiring.');
  if (maxFee > 200n * 10n ** 9n) warnings.push('Gas narxi juda yuqori (' + fmtUnits(maxFee, 9) + ' gwei). Keyinroq urinib ko\'rish arzonroq bo\'lishi mumkin.');
  if (!isTok && N.id !== 1) warnings.push('Faqat ' + N.name + ' tarmog\'idagi ' + N.nat + ' yuboriladi. Qabul qiluvchi manzil ham shu tarmoqda bo\'lishi shart.');

  return {
    sym: isTok ? T.sym : N.nat, dec, cg: isTok ? T.cg : N.natCg, amount: isTok ? tokenAmt : value,
    feeSym: N.nat, feeDec: 18, feeCg: N.natCg, fee: feeExp, feeMax, to: ti.address, warnings,
    notes: ['Gas: ' + gas + ' · tip ' + fmtUnits(tip, 9) + ' gwei · maxFee ' + fmtUnits(maxFee, 9) + ' gwei · nonce ' + tx.nonce],
    sign: m => WL.ethSign({ mnemonic: m, from: it.address, tx }),
    broadcast: s => rpc(N.rpc, 'eth_sendRawTransaction', [s.raw]),
    idOf: s => s.hash
  };
}

async function prepSOL(it, to, amtStr) {

  return {
    sym: 'SOL', dec: 9, cg: 'solana', amount, feeSym: 'SOL', feeDec: 9, feeCg: 'solana', fee: FEE, to, warnings,
    notes: ['Komissiya tarmoq tomonidan belgilangan (5000 lamport).'],
    sign: m => WL.solSign({ mnemonic: m, from: it.address, to, lamports: amount, blockhash }),
    broadcast: s => rpc(SOL_RPC, 'sendTransaction', [s.b64, { encoding: 'base64', preflightCommitment: 'confirmed' }]),
    idOf: s => s.signature
  };
}
async function prepTRX(it, to, amtStr) {

    // "Hammasi": bepul bandwidth kutilmaganda tugab qolsa ham tranzaksiya yiqilmasligi uchun eng yomon holat zaxirada qoldiriladi.
    const feeMax = (max ? bwBytes * bwPrice : bwBurn) + act;
    let amount = max ? trxBal - feeMax : parseUnits(amtStr, 6);
    if (!amount || amount <= 0n) throw new Error('Summa noto\'g\'ri yoki balans yetarli emas.');
    if (amount + fee > trxBal) throw new Error('TRX balansi yetarli emas (bor: ' + fmtUnits(trxBal, 6) + ' TRX, komissiya: ' + fmtUnits(fee, 6) + ' TRX).');
    if (inactive) warnings.push('Qabul qiluvchi hisob hali Tron tarmog\'ida faollashtirilmagan: ' + fmtUnits(newAcctFee, 6) + ' TRX qo\'shimcha komissiya olinadi.');

      notes: ['Komissiya taxminiy: ' + (bwBurn === 0n ? 'bepul bandwidth yetadi' : 'bandwidth uchun TRX yoqiladi') + (inactive ? ', hisobni faollashtirish bilan' : '') + '.'],
      sign: m => WL.tronSign({ mnemonic: m, from: it.address, tx: { kind: 'trx', to: ti.address, amount, ...ref } }),

}
async function tronBroadcast(s) {
  const r = await tronPost('/wallet/broadcasttransaction', { txID: s.txid, raw_data: s.raw_data, raw_data_hex: s.raw_data_hex, visible: false, signature: s.signature });
  if (r && r.result === true) return r.txid || s.txid;
  let msg = '';
  try { msg = r && r.message ? decodeURIComponent(String(r.message).replace(/../g, '%$&')) : ''; } catch (e) { msg = String((r && r.message) || ''); }
  throw new Error('Tron tarmog\'i rad etdi' + (r && r.code ? ' (' + r.code + ')' : '') + (msg ? ': ' + msg : '') + '.');
}

async function loadHist() {

    const st = t.status === 'pending' ? ' · Kutilmoqda' : t.status === 'failed' ? ' · Muvaffaqiyatsiz' : '';

let key = null, data = null;
let prices = {}, balances = {}, lastUpdate = null, hidden = false;

async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function save() {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(data)));
  const out = new Uint8Array(12 + ct.byteLength); out.set(iv); out.set(new Uint8Array(ct), 12);
  if (!store.set('cw_vault', b64(out))) throw new Error('Brauzer saqlashga ruxsat bermayapti');
}
async function load() {
  const raw = unb64(store.get('cw_vault'));
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
  return JSON.parse(dec.decode(pt));
}

let clipTimer = null;
function clipSoon(ms) { clearTimeout(clipTimer); clipTimer = setTimeout(() => { try { navigator.clipboard.writeText(''); } catch (e) {} }, ms); }

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

function wordBoxes(host, n, opt = {}) {
  host.innerHTML = ''; host.className = 'words';
  const inputs = [];
  const check = inp => {
    const v = inp.value.replace(/\s/g, '').toLowerCase();
    if (inp.value !== v) inp.value = v;
    const st = !v ? '' : WSET.has(v) ? 'ok' : (!WL.words.some(w => w.startsWith(v)) ? 'bad' : '');
    inp.classList.remove('ok', 'bad'); inp.parentNode.classList.remove('ok', 'bad');
    if (st) { inp.classList.add(st); inp.parentNode.classList.add(st); }
    if (st === 'bad') { inp.setAttribute('aria-invalid', 'true'); inp.title = 'Ro\'yxatda yo\'q'; }
    else { inp.removeAttribute('aria-invalid'); inp.removeAttribute('title'); }
  };
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'w';
    const sp = document.createElement('span'); sp.textContent = String(i + 1); sp.setAttribute('aria-hidden', 'true');
    const inp = document.createElement('input');
    inp.type = opt.hide ? 'password' : 'text';
    inp.autocomplete = 'off'; inp.spellcheck = false; inp.autocapitalize = 'off';
    inp.setAttribute('autocorrect', 'off');
    inp.setAttribute('aria-label', (i + 1) + '-so\'z');
    if (opt.values) inp.value = opt.values[i] || '';
    if (opt.readonly) inp.readOnly = true;
    d.append(sp, inp); host.append(d); inputs.push(inp);
    if (opt.readonly) continue;
    inp.addEventListener('input', () => check(inp));
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter' && i === n - 1 && opt.onenter) { e.preventDefault(); opt.onenter(); return; }
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (inputs[i + 1]) inputs[i + 1].focus(); }
      else if (e.key === 'Backspace' && !inp.value && inputs[i - 1]) { e.preventDefault(); inputs[i - 1].focus(); }
    });
    inp.addEventListener('paste', e => {
      const t = (e.clipboardData || window.clipboardData).getData('text');
      const parts = t.trim().toLowerCase().split(/[\s,;]+/).filter(Boolean);
      if (parts.length > 1) {
        e.preventDefault();
        parts.slice(0, n - i).forEach((w, k) => { inputs[i + k].value = w; check(inputs[i + k]); });
        inputs[Math.min(i + parts.length, n - 1)].focus();
        if (parts.length >= 11) clipSoon(1500);
      }
    });
  }
  return {
    inputs,
    values: () => inputs.map(x => x.value.trim().toLowerCase()),
    setHide: h => inputs.forEach(x => { x.type = h ? 'password' : 'text'; })
  };
}

function segControl(host, cur, cb) {

    b.onclick = () => cb(n); host.append(b);

function checkWords(w) {
  if (w.some(x => !x)) return 'Barcha so\'zlarni kiriting.';
  const bad = w.findIndex(x => !WSET.has(x));
  if (bad >= 0) return (bad + 1) + '-so\'z ro\'yxatda yo\'q.';
  if (!WL.validate(w.join(' '))) return 'So\'zlar tartibi yoki tarkibi noto\'g\'ri (kontrol yig\'indisi mos kelmadi).';
  return '';
}

}

    if (eth && !data.items.some(x => x.coin === 'TON' && x.address === a.TON)) {
      data.items.push({ id: uid(), kind: 'addr', coin: 'TON', label: eth.label, address: a.TON, src: 'phrase' });
      await save();
    }
  } catch (e) { /* TON qo'shilmasa ham kirish davom etadi */ }
}

async function createVault(phrase) {
  quickWipe();
  const items = deriveItems(phrase, 'Asosiy hamyon');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  key = await deriveKey(phrase, salt);
  data = { items };
  if (!store.set('cw_salt', b64(salt)) || !store.set('cw_ver', '3')) throw new Error('Brauzer saqlashga ruxsat bermayapti');
  await save();
  cs = null; balances = {}; prices = {}; attempts = 0;
  showMain();
}

function newCreateState(n) {
  const words = WL.generate(n === 24 ? 256 : 128).split(' ');
  const pos = new Set();
  while (pos.size < 3) pos.add(crypto.getRandomValues(new Uint32Array(1))[0] % n);
  return { n, words, check: [...pos].sort((a, b) => a - b), step: 1 };
}

function wipeAll() { store.del('cw_limit'); store.del('cw_sent'); store.del('cw_vault'); store.del('cw_salt'); store.del('cw_ver'); store.del('cw_mining'); store.del('cw_qtip'); quickWipe(); }
function doWipe() {
  wipeAll();
  if (store.get('cw_vault') || store.get('cw_salt')) { authMsg('O\'chirib bo\'lmadi: brauzer saqlashga ruxsat bermayapti.'); return; }

}

function paneCreate(has) {
  const pane = $('#pane');
  if (!cs) cs = newCreateState(12);
  if (cs.step === 1) {
    pane.innerHTML = `
      <p class="mut">Sizga ${cs.n} ta maxfiy so'z berildi. Hamyonga faqat shu so'zlar bilan kirasiz.</p>
      <div id="seg"></div>
      <div id="wb"></div>
      <div class="btns"><button type="button" class="sec" id="copy">Nusxalash</button><button type="button" class="sec" id="regen">Boshqasini yaratish</button></div>
      ${has ? '<div class="warn">Diqqat: bu qurilmada hamyon allaqachon bor. Yangi hamyon yaratsangiz, eskisi o\'chadi. Avval eski hamyonni zaxira faylga saqlang yoki uning so\'zlarini yozib oling.</div>' : ''}
      <div class="warn">So'zlarni shu tartibda qog'ozga yozing yoki parol menejerida saqlang. Skrinshot qilmang, hech kimga bermang. Yo'qotsangiz, hamyonni tiklab bo'lmaydi.</div>
      <button type="button" id="next" class="w100">Saqladim, davom etish</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>`;
    wordBoxes($('#wb'), cs.n, { readonly: true, values: cs.words });
    segControl($('#seg'), cs.n, n => { cs = newCreateState(n); paneCreate(has); });
    $('#regen').onclick = () => { cs = newCreateState(cs.n); paneCreate(has); };
    $('#copy').onclick = async () => {
      if (await copyText(cs.words.join(' '))) { clipSoon(60000); authMsg('Nusxalandi. Xavfsizlik uchun bufer 60 soniyadan keyin tozalanadi, shu vaqtgacha so\'zlarni xavfsiz joyga saqlang.'); }
      else authMsg('Nusxalab bo\'lmadi, so\'zlarni qo\'lda ko\'chiring.');
    };
    $('#next').onclick = () => { cs.step = 2; paneCreate(has); };
  } else {
    const pos = cs.check;
    pane.innerHTML = `
      <p class="mut">Tasdiqlash uchun so'zlarni kiriting: ${pos.map(p => '#' + (p + 1)).join(', ')}.</p>
      <div class="vgrid">${pos.map(p => `<div><label for="v${p}">${p + 1}-so'z</label><input id="v${p}" class="vin" autocomplete="off" spellcheck="false" autocapitalize="off"></div>`).join('')}</div>
      <button type="button" id="mk" class="w100">Hamyonni yaratish</button>
      <div class="btns mt8"><button type="button" id="back" class="sec">Orqaga</button></div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>`;
    $('#back').onclick = () => { cs.step = 1; paneCreate(has); };
    $('#mk').onclick = async () => {
      const ins = [...pane.querySelectorAll('.vin')];
      if (!ins.every((inp, k) => inp.value.trim().toLowerCase() === cs.words[pos[k]])) return authMsg('So\'zlar mos kelmadi. Orqaga qaytib, tekshiring.');
      if (has && !(await ask('Bu qurilmadagi mavjud hamyon o\'chadi va tiklab bo\'lmaydi. Davom etasizmi?', { danger: true, ok: 'Ha, yangisini yaratish' }))) return;
      $('#mk').disabled = true; authMsg('Tayyorlanmoqda...');
      try { await createVault(cs.words.join(' ')); }
      catch (e) { $('#mk').disabled = false; authMsg('Xato: ' + e.message); }
    };
  }
}

function paneImport(has) {
  const pane = $('#pane');
  let hide = true;
  pane.innerHTML = `
    <p class="mut">${has
      ? 'Hamyoningizga kirish uchun maxfiy so\'zlarni kiriting.'
      : 'Bu qurilmada hamyon yo\'q. Kiritilgan so\'zlar bilan hamyon yaratiladi, balans shu so\'zlardan hosil bo\'lgan manzillar orqali ko\'rsatiladi.'}</p>
    <div id="seg"></div>
    <div id="wb"></div>
    <div class="btns"><button type="button" class="sec sm" id="eye">Ko'rsatish</button><button type="button" class="sec sm" id="clr">Tozalash</button></div>
    <div class="mt14"><button type="button" id="go" class="w100">${has ? 'Kirish' : 'Kiritish'}</button></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    ${has && !pinOn() && !bioOn() ? '<p class="mut">Tezroq kirish uchun: hamyonga kirgach Sozlamalar > Kirish usuli orqali parol, PIN yoki Face ID o\'rnating.</p>' : ''}
    <hr class="sep">
    <div class="btns">
      <label class="btn sec" style="margin:0;cursor:pointer;color:var(--txt)">Zaxira faylini yuklash
        <input id="imp" type="file" accept=".json" hidden></label>
      ${has ? '<button type="button" id="wipe" class="danger">Hammasini o\'chirish</button>' : ''}
    </div>`;
  if (pinOn() || bioOn()) pinMount(pane);
  const box = wordBoxes($('#wb'), impN, { hide: true, onenter: () => go() });
  segControl($('#seg'), impN, n => { impN = n; paneImport(has); });
  $('#eye').onclick = () => { hide = !hide; box.setHide(hide); $('#eye').textContent = hide ? 'Ko\'rsatish' : 'Yashirish'; };
  $('#clr').onclick = () => { box.inputs.forEach(x => { x.value = ''; x.classList.remove('ok', 'bad'); x.parentNode.classList.remove('ok', 'bad'); x.removeAttribute('aria-invalid'); x.removeAttribute('title'); }); box.inputs[0].focus(); };
  const go = async () => {
    const w = box.values();
    const err = checkWords(w);
    if (err) return authMsg(err);
    const phrase = w.join(' ');
    if (!has) {
      authMsg('Tayyorlanmoqda...');
      try { await createVault(phrase); } catch (e) { authMsg('Xato: ' + e.message); }
      return;
    }
    authMsg('Tekshirilmoqda...'); $('#go').setAttribute('aria-busy', 'true');
    if (attempts > 0) await sleep(Math.min(attempts * 1000, 10000));
    try {
      key = await deriveKey(phrase, unb64(store.get('cw_salt')));
      data = await load();
      await ensureTon(phrase);
      attempts = 0; showMain();
    } catch (e) {
      key = null; attempts++; $('#go').removeAttribute('aria-busy');
      authMsg(e && e.name === 'OperationError'
        ? 'Bu so\'zlar mavjud hamyonga mos kelmadi. So\'zlar tartibi va yozilishini tekshiring.' + (attempts >= 2 ? ' Agar so\'zlarga ishonchingiz komil bo\'lsa, saqlangan ma\'lumot buzilgan bo\'lishi mumkin: zaxira faylidan tiklang.' : '')
        : 'Saqlangan ma\'lumotni o\'qib bo\'lmadi (buzilgan bo\'lishi mumkin). Zaxira faylidan tiklang yoki hamyonni so\'zlar bilan qayta qo\'shing.');
    }
  };
  $('#go').onclick = go;
  if ($('#wipe')) $('#wipe').onclick = async () => {
    if (await ask('Barcha saqlangan ma\'lumotlar o\'chadi va tiklab bo\'lmaydi. Davom etasizmi?', { danger: true, ok: 'Ha, hammasini o\'chirish' })) doWipe();
  };
  $('#imp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      if (f.size > 1000000) throw new Error('big');
      const j = JSON.parse(await f.text());
      if (!j || typeof j !== 'object' || typeof j.salt !== 'string' || typeof j.vault !== 'string') throw new Error('shape');
      if (j.ver !== '3') return authMsg('Bu zaxira eski versiyaniki, mos kelmaydi.');
      // Mavjud hamyonni buzuq fayl bilan almashtirib yubormaslik uchun tuzilmani oldindan qat'iy tekshiramiz.
      const okB64 = x => /^[A-Za-z0-9+/]+={0,2}$/.test(x) && x.length % 4 === 0;
      if (!okB64(j.salt) || !okB64(j.vault)) throw new Error('b64');
      const sl = unb64(j.salt).length, vl = unb64(j.vault).length;
      if (sl !== 16 || vl < 30 || vl > 400000) throw new Error('len');
      if (has && !(await ask('Mavjud ma\'lumotlar zaxira bilan almashtiriladi. Davom etasizmi?', { danger: true, ok: 'Almashtirish' }))) return;
      const old = { s: store.get('cw_salt'), v: store.get('cw_vault'), r: store.get('cw_ver') };
      if (!(store.set('cw_salt', j.salt) && store.set('cw_vault', j.vault) && store.set('cw_ver', '3'))) {
        if (old.s !== null) store.set('cw_salt', old.s); if (old.v !== null) store.set('cw_vault', old.v); if (old.r !== null) store.set('cw_ver', old.r);
        return authMsg('Zaxirani saqlab bo\'lmadi. Mavjud hamyon o\'zgarmadi.');
      }
      quickWipe(); showAuth('import'); authMsg('Zaxira yuklandi. Hamyon so\'zlarini kiriting.');
    } catch (err) { authMsg('Fayl noto\'g\'ri. Mavjud hamyon o\'zgarmadi.'); }
  };
}

}

/* ---------- Mining: Bitcoin tarmog'i statistikasi va foyda kalkulyatori ----------
   Faqat ommaviy ma'lumot o'qiladi (mempool.space va CoinGecko). Manzil, kalit yoki balans hech qayerga yuborilmaydi.
   Ilovaning o'zi mining qilmaydi va hamyon balansiga tegmaydi: bu bo'lim faqat ma'lumot va hisob-kitob uchun.
   Kutilgan daromad (BTC/kun) = hashrate(H/s) * 86400 * blok mukofoti / (qiyinlik * 2^32), pool komissiyasi ayriladi. */
const MEMPOOL = 'https://mempool.space/api';
const HALVING = 210000, TWO32 = 4294967296;
const MN_DEF = { ths: '200', w: '3500', kwh: '0.07', fee: '1' };
const MN_LIM = { ths: [0.001, 1e6], w: [0, 1e7], kwh: [0, 100], fee: [0, 100] };
let MN = null, mnBusy = false, mnFail = false, mnSrTimer = 0;

/* Son yoki null: API kutilmagan qiymat qaytarsa, bema'ni raqam ko'rsatmaymiz */
const fin = (v, lo = -Infinity, hi = Infinity) => { if (v == null || v === '') return null; const n = Number(v); return Number.isFinite(n) && n >= lo && n <= hi ? n : null; };
const fx = (n, d = 2) => n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = n => n < 0 ? '−' : '+';
const subsidySat = h => Math.floor(5e9 / Math.pow(2, Math.floor(h / HALVING)));
const dateTxt = ms => new Date(ms).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
const hashTxt = h => h >= 1e21 ? fx(h / 1e21, 2) + ' ZH/s' : fx(h / 1e18, 1) + ' EH/s';

/* Bitta qurilma uchun kunlik natija. n: { diff, reward (BTC), price }, i: { ths, w, kwh, fee } */
function miningCalc(n, i) {
  const perTh = 1e12 * 86400 * n.reward / (n.diff * TWO32);            // BTC / TH / kun, pool komissiyasiz
  const btc = perTh * i.ths * (1 - i.fee / 100), rev = btc * n.price;
  const kwhDay = i.w / 1000 * 24, cost = kwhDay * i.kwh, profit = rev - cost;
  return { btc, rev, cost, profit, month: profit * 30, hp: perTh * n.price,
    beKwh: kwhDay > 0 ? rev / kwhDay : null, beBtc: btc > 0 && cost > 0 ? cost / btc : null };
}

function spark(vals, label) {
  const W = 300, H = 56, p = 4, lo = Math.min(...vals), span = Math.max(...vals) - lo || 1;
  const d = 'M' + vals.map((v, i) => (i / (vals.length - 1) * W).toFixed(1) + ' ' + (H - p - (v - lo) / span * (H - 2 * p)).toFixed(1)).join('L');
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + label + '"><path class="ar" d="' + d + 'L' + W + ' ' + H + 'L0 ' + H + 'Z"/><path d="' + d + '"/></svg>';
}

async function btcPrice() {
  if (prices.bitcoin && prices.bitcoin.usd) return prices.bitcoin;
  const j = await jfetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true');
  if (j.bitcoin && Number.isFinite(j.bitcoin.usd)) prices.bitcoin = { usd: j.bitcoin.usd, ch: Number.isFinite(j.bitcoin.usd_24h_change) ? j.bitcoin.usd_24h_change : undefined };
  return prices.bitcoin;
}

/* Sahifa ochilganda: oxirgi ma'lumot darhol ko'rinadi, 60 soniyadan eskirgan bo'lsa fonda yangilanadi */
async function loadMining(force) {
  paintMining();
  if (mnBusy || (!force && MN && Date.now() - MN.t < 60000)) return;
  mnBusy = true; paintMining();
  const get = p => jfetch(MEMPOOL + p);
  const [adj, hr, rw, tip, px] = (await Promise.allSettled([get('/v1/difficulty-adjustment'), get('/v1/mining/hashrate/1m'),
    get('/v1/mining/reward-stats/144'), get('/blocks/tip/height'), btcPrice()])).map(r => r.status === 'fulfilled' ? r.value : null);
  const A = adj || {}, H = hr || {}, R = rw || {}, P = px || {};
  const series = (Array.isArray(H.hashrates) ? H.hashrates : []).map(x => fin(x && x.avgHashrate, 1e15, 1e25)).filter(v => v !== null);
  const dl = Array.isArray(H.difficulty) && H.difficulty.length ? H.difficulty[H.difficulty.length - 1] : null;
  const first = fin(R.startBlock), last = fin(R.endBlock);
  const blocks = first !== null && last !== null && last >= first ? last - first + 1 : 144;
  const fee = fin(R.totalFee, 0, 1e15);
  const left = fin(A.remainingBlocks, 0, 2016);
  const net = {
    t: Date.now(), series,
    hash: fin(H.currentHashrate, 1e15, 1e25) ?? (series.length ? series[series.length - 1] : null),
    diff: fin(H.currentDifficulty, 1e9, 1e18) ?? fin(dl && dl.difficulty, 1e9, 1e18),
    height: fin(tip, 1, 1e8) ?? fin(R.endBlock, 1, 1e8),
    feeSat: fee !== null ? fin(fee / blocks, 0, 1e10) : null,
    price: fin(P.usd, 1e-6, 1e9), ch: fin(P.ch),
    adj: left !== null ? { left, pct: fin(A.difficultyChange, -100, 1000), prog: fin(A.progressPercent, 0, 100), date: fin(A.estimatedRetargetDate, 1), avg: fin(A.timeAvg, 3e5, 9e5) } : null
  };
  mnFail = ![net.hash, net.diff, net.height, net.adj].some(v => v !== null);   // narxning o'zi tarmoq ma'lumoti emas
  if (!mnFail) {
    /* Qisman xato bo'lsa, olinmagan qiymat oxirgi muvaffaqiyatli yuklangan qiymat bilan to'ldiriladi */
    const none = v => v === null || (Array.isArray(v) && !v.length);
    net.stale = false;
    if (MN) for (const g of [['series'], ['hash'], ['diff'], ['height'], ['feeSat'], ['price', 'ch'], ['adj']]) {
      if (none(net[g[0]]) && !none(MN[g[0]])) { for (const k of g) net[k] = MN[k]; net.stale = true; }
    }
    net.reward = net.height !== null ? (subsidySat(net.height + 1) + (net.feeSat || 0)) / 1e8 : null;
    MN = net;
  }
  mnBusy = false; paintMining();
}

/* ---------- Narxlar sahifasi: barcha kriptolarning hozirgi narxi (faqat ommaviy ma'lumot, CoinGecko) ---------- */
let PX = null, pxBusy = false, pxAt = null, pxErr = false;
const pxCoins = () => {
  const seen = new Set(), out = [];
  const add = (cg, sym, name) => { if (!cg || seen.has(cg)) return; seen.add(cg); out.push({ cg, sym, name }); };
  for (const k of ['BTC', 'ETH', 'TON', 'SOL', 'TRX']) if (COINS[k]) add(COINS[k].cg, COINS[k].sym, String(COINS[k].name).split(' (')[0]);
  for (const c of Object.values(COINS)) add(c.cg, c.sym, String(c.name).split(' (')[0]);
  return out;
};
const fmtPx = n => n >= 1 ? '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
  : '$' + n.toLocaleString('en-US', { minimumSignificantDigits: 2, maximumSignificantDigits: 4, maximumFractionDigits: 10 });
async function loadPx() {
  if (pxBusy) return; pxBusy = true; pxErr = false; paintPx();
  try {
    const ids = pxCoins().map(c => c.cg), res = {};
    for (let i = 0; i < ids.length; i += 40) {
      const j = await jfetch('https://api.coingecko.com/api/v3/simple/price?ids=' + ids.slice(i, i + 40).map(encodeURIComponent).join(',') + '&vs_currencies=usd&include_24hr_change=true');
      for (const id of ids.slice(i, i + 40)) if (j[id] && Number.isFinite(j[id].usd)) res[id] = { usd: j[id].usd, ch: Number.isFinite(j[id].usd_24h_change) ? j[id].usd_24h_change : undefined };
    }
    if (!Object.keys(res).length) throw new Error('bo\'sh javob');
    PX = res; pxAt = new Date();
    for (const id in res) prices[id] = res[id];
  } catch (e) { pxErr = true; }
  pxBusy = false; paintPx();
}
function paintPx() {
  const ul = $('#px-list'); if (!ul) return;
  ul.setAttribute('aria-busy', String(pxBusy));

  const have = PX || {};

  ul.innerHTML = rows.map(c => {
    const p = have[c.cg], ch = p && p.ch;
    const chTxt = Number.isFinite(ch) ? (ch >= 0 ? '▲ +' : '▼ −') + Math.abs(ch).toFixed(2) + '%' : '';
    return '<li><span class="ci" aria-hidden="true" style="--c:' + (CCOL[c.sym] || 'var(--coin-other)') + '">' + (GLYPH[c.sym] || esc(c.sym.slice(0, 1))) + '</span>'
      + '<span class="px-t"><span class="px-n">' + esc(c.name) + '</span><span class="px-s">' + esc(c.sym) + '</span></span>'
      + '<span class="px-v">' + (p ? esc(fmtPx(p.usd)) : '—') + (chTxt ? '<span class="px-c ' + (ch >= 0 ? 'up' : 'down') + '">' + chTxt + '</span>' : '') + '</span></li>';
  }).join('');
}
function openPrices() {
  $('#px-refresh').onclick = () => loadPx();

function paintMining() {

  }

        sr.length > 1 ? spark(sr, 'Oxirgi ' + sr.length + ' kunda hashrate: ' + chgTxt) : '')
    + tile('Qiyinlik', n.diff !== null ? fx(n.diff / 1e12, 2) + ' T' : dash, '')
    + tile('Blok mukofoti', n.reward !== null ? fx(n.reward, 4) + ' BTC' : dash,

    + tile('BTC narxi', n.price !== null ? fmtUsd(n.price) : dash,

    + tile('Hashprice', hp !== null ? '$' + fx(hp, 4) : dash, '1 TH/s uchun kuniga')

        a ? (a.date !== null ? '~ ' + dateTxt(a.date > 1e12 ? a.date : a.date * 1000) + ' · ' : '') + fx(a.left, 0) + ' blok qoldi' : '', ' w2',
        a && a.prog !== null ? '<div class="bar" aria-hidden="true"><div style="width:' + a.prog.toFixed(1) + '%;background:var(--sky)"></div></div>' : '')
    + tile('Keyingi halving', toHalv !== null ? fx(toHalv, 0) + ' blok qoldi' : dash,

    + '</div>'

      : n.stale || [n.hash, n.diff, n.height, n.feeSat, n.price, n.adj].some(v => v === null)
        ? '<div class="warn">Ba\'zi ma\'lumotlar olinmadi' + (n.stale ? ', ularning oxirgi qiymati ko\'rsatilmoqda' : '') + '. "Yangilash" tugmasini bosing.</div>' : '')
    + '<p class="mut" style="margin:12px 0 0">' + (n.height !== null ? 'Oxirgi blok: #' + fx(n.height, 0) + ' · ' : '') + 'Yangilandi: ' + new Date(n.t).toLocaleTimeString() + '</p>';
  paintCalc();
}

const mnInputs = () => { const o = {}; for (const k of Object.keys(MN_DEF)) { const s = $('#mn-' + k).value.trim().replace(',', '.'); o[k] = s === '' ? NaN : Number(s); } return o; };

/* ---------- PIN bilan tez kirish ----------
   PIN maxfiy so'zlarni Argon2id (64 MiB) + AES-GCM bilan shifrlab saqlaydi; Android ilovada kalit Keystore (chip) bilan ham bog'lanadi. 5 marta xato kiritilsa PIN o'chadi va so'zlar kerak bo'ladi.
   Eslatma: Qisqa PIN qurilma o'g'irlansa va kimdir xotirani nusxalab olsa, oflayn topilishi mumkin. Katta summa uchun so'zlar bilan kirish xavfsizroq. */
const PIN_TRIES = 5, PW_TRIES = 10;
const pinOn = () => !!store.get('cw_pin');
const pinType = () => store.get('cw_pintype') === 'pw' ? 'pw' : 'pin';
const pinWipe = () => { store.del('cw_pin'); store.del('cw_pinfail'); store.del('cw_pintype'); try { if (window.HamyonNative && window.HamyonNative.clearPepper) window.HamyonNative.clearPepper(); } catch (e) { /* kalit yo'q */ } };
const bioOn = () => !!store.get('cw_bio');
const bioWipe = () => { store.del('cw_bio'); try { if (window.HamyonNative) window.HamyonNative.clear(); } catch (e) { /* kalit allaqachon yo'q */ } };
const quickWipe = () => { pinWipe(); bioWipe(); };
const pinWeak = p => /^(\d)\1+$/.test(p) || '01234567890123456789'.includes(p) || '98765432109876543210'.includes(p) || /^(\d{2,3})\1+$/.test(p);
const PW_COMMON = ['password', 'parol123', 'qwertyui', 'qwerty123', 'abcd1234', '12345678', '123456789', '1234567890', 'iloveyou', 'password1', 'wallet123', 'hamyon123'];
const pwWeak = p => /^(.)\1+$/.test(p) || PW_COMMON.includes(p.toLowerCase()) || pinWeak(p) || /^(.{1,3})\1+$/.test(p);
/* v27: PIN kaliti Argon2id (64 MiB xotira, 3 o'tish) bilan olinadi. Xotira talab qilgani uchun GPU bilan oflayn topish ancha qimmat.
   Saqlash formati: "v2." + base64(tuzi 16 | iv 12 | shifr). Eski (PBKDF2) format birinchi to'g'ri kirishda avtomatik yangilanadi. */
const A2 = { m: 65536, t: 3 };
/* v29: Android ilovada PIN kaliti Keystore (qurilma chipi) ichidagi eksport qilib bo'lmaydigan HMAC kaliti bilan aralashtiriladi ("v3.").
   Shunda shifrlangan fayl nusxa olinsa ham, PINni boshqa kompyuterda oflayn topib bo'lmaydi. Brauzerda "v2." (faqat Argon2id) ishlatiladi. */
const hasPepper = () => { try { return !!(window.HamyonNative && typeof window.HamyonNative.pepper === 'function'); } catch (e) { return false; } };

  const raw = await hashwasm.argon2id({ password: 'pin:' + pin, salt, parallelism: 1, iterations: A2.t, memorySize: A2.m, hashLength: 32, outputType: 'binary' });
  let mat = raw;

    const p = hasPepper() ? String(window.HamyonNative.pepper(b64(salt)) || '') : '';
    if (!p) throw new Error('PEPPER');
    const pb = unb64(p), cat = new Uint8Array(raw.length + pb.length); cat.set(raw); cat.set(pb, raw.length);
    mat = new Uint8Array(await crypto.subtle.digest('SHA-256', cat));
