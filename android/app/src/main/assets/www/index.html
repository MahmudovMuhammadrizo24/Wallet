}
async function pinSeal(phrase, pin, type) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  let v3 = hasPepper(), k;
  if (v3) { try { k = await pinKey(pin, salt, true); } catch (e) { v3 = false; } }
  if (!v3) k = await pinKey(pin, salt, false);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, enc.encode(phrase)));
  const out = new Uint8Array(28 + ct.length); out.set(salt); out.set(iv, 16); out.set(ct, 28);
  return store.set('cw_pin', (v3 ? 'v3.' : 'v2.') + b64(out)) && store.set('cw_pinfail', '0') && store.set('cw_pintype', type === 'pw' ? 'pw' : 'pin');
}
async function pinOpen(pin) {
  const s = store.get('cw_pin'), ver = typeof s === 'string' && /^v[23]\./.test(s) ? s.slice(0, 2) : 'v1';
  let key;
  try { const raw = unb64(ver === 'v1' ? s : s.slice(3)); key = { raw, k: ver === 'v1' ? await deriveKey('pin:' + pin, raw.slice(0, 16)) : await pinKey(pin, raw.slice(0, 16), ver === 'v3') }; }
  catch (e) { if (ver === 'v3' && e && e.message === 'PEPPER') throw new Error('PEPPER'); if (ver !== 'v1') throw new Error('KDF'); return null; }
  try {
    const pt = dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: key.raw.slice(16, 28) }, key.k, key.raw.slice(28)));
    if (ver === 'v1' || (ver === 'v2' && hasPepper())) { try { const f = store.get('cw_pinfail'); await pinSeal(pt, pin, pinType()); store.set('cw_pinfail', f === null ? '0' : f); } catch (e) { /* yangilanmadi: eski format ishlayveradi */ } }
    return pt;
  } catch (e) { return null; }
}

/* ---------- Face ID / barmoq izi (WebAuthn + PRF) ----------
   Qurilma autentifikatori (Face ID, Touch ID, Windows Hello, Android barmoq izi) faqat yuzni/barmoqni tasdiqlagandan keyin
   32 baytli maxfiy qiymat (PRF) beradi. Shu qiymat maxfiy so'zlarni AES-GCM bilan shifrlaydi. Qiymat qurilmadan chiqmaydi va saqlanmaydi,
   shuning uchun faqat brauzer xotirasini nusxalash yetarli emas. PRF qo'llab-quvvatlanmasa, funksiya yoqilmaydi (soxta "qulf" yo'q). */
/* Android ilova (WebView) ichida: kalit telefonning Keystore xotirasida, faqat barmoq izi/yuz tasdiqlangandagina ochiladi.
   Natijalar window.__hn orqali qaytadi. Brauzerda window.HamyonNative yo'q va WebAuthn yo'li ishlaydi. */
const hnCb = {};
window.__hn = (id, ok, p) => { const f = hnCb[id]; delete hnCb[id]; if (f) f(ok, p); };
const nat = (m, ...a) => new Promise((res, rej) => {
  const id = 'c' + Math.random().toString(36).slice(2);
  hnCb[id] = (ok, p) => { if (ok) return res(p); const e = new Error(p === 'UNAVAILABLE' ? 'PRF' : p); e.name = p === 'INVALID' ? 'OperationError' : 'NotAllowedError'; rej(e); };
  try { window.HamyonNative[m](id, ...a); } catch (e) { delete hnCb[id]; rej(e); }
});
const bioSupported = async () => {
  if (window.HamyonNative) { try { return window.HamyonNative.avail() === 'yes'; } catch (e) { return false; } }
  try { return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
  catch (e) { return false; }
};
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
async function bioPrf(credId, salt) {
  const a = await navigator.credentials.get({ publicKey: { challenge: rnd(32), rpId: location.hostname, allowCredentials: [{ type: 'public-key', id: credId, transports: ['internal', 'hybrid'] }], userVerification: 'required', timeout: 60000, extensions: { prf: { eval: { first: salt } } } } });
  const r = a && a.getClientExtensionResults && a.getClientExtensionResults().prf;
  if (!r || !r.results || !r.results.first) throw new Error('PRF');
  return new Uint8Array(r.results.first);
}
async function bioSeal(phrase) {
  if (window.HamyonNative) {
    const r = JSON.parse(await nat('seal', b64(enc.encode(phrase))));
    if (!store.set('cw_bio', JSON.stringify({ v: 2, n: 1, iv: r.iv, ct: r.ct }))) throw new Error('save');
    return;
  }
  const cred = await navigator.credentials.create({ publicKey: { rp: { name: 'Mening hamyonim', id: location.hostname }, user: { id: rnd(16), name: 'hamyon', displayName: 'Mening hamyonim' }, challenge: rnd(32),
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000, extensions: { prf: {} } } });
  const ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
  if (!ext.prf || !ext.prf.enabled) throw new Error('PRF');
  const id = new Uint8Array(cred.rawId), salt = rnd(32), iv = rnd(12);
  const k = await crypto.subtle.importKey('raw', await bioPrf(id, salt), 'AES-GCM', false, ['encrypt']);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, enc.encode(phrase)));
  if (!store.set('cw_bio', JSON.stringify({ v: 1, id: b64(id), salt: b64(salt), iv: b64(iv), ct: b64(ct) }))) throw new Error('save');
}
async function bioOpen() {
  const o = JSON.parse(store.get('cw_bio'));
  if (o.n) { if (!window.HamyonNative) throw new Error('PRF'); return dec.decode(unb64(await nat('open', o.iv, o.ct))); }
  const k = await crypto.subtle.importKey('raw', await bioPrf(unb64(o.id), unb64(o.salt)), 'AES-GCM', false, ['decrypt']);
  return dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(o.iv) }, k, unb64(o.ct)));
}

/* Qulf ochish ekranida: Face ID tugmasi, PIN yoki parol maydoni so'zlar maydonining ustida */
function pinMount(pane) {
  const pw = pinType() === 'pw', hasPin = pinOn(), hasBio = bioOn(), nm = pw ? 'Parol' : 'PIN', TRIES = pw ? PW_TRIES : PIN_TRIES;
  let h = '<div id="pin-box">';
  if (hasBio) h += '<button type="button" id="bio-go" class="w100">Face ID / barmoq izi bilan kirish</button><div class="msg" id="bio-msg" role="status" aria-live="polite"></div>' + (hasPin ? '<hr class="sep">' : '');
  if (hasPin) h += '<label for="pin-in">' + (pw ? 'Parol' : 'PIN (6-12 raqam)') + '</label>'
    + '<input id="pin-in" type="password" ' + (pw ? 'autocapitalize="off" spellcheck="false" maxlength="128"' : 'inputmode="numeric" pattern="[0-9]*" maxlength="12"') + ' autocomplete="off">'
    + '<button type="button" id="pin-go" class="w100 mt10">' + nm + ' bilan kirish</button>'
    + '<div class="msg" id="pin-msg" role="status" aria-live="polite"></div>';
  h += '<p class="mut" style="text-align:center">yoki maxfiy so\'zlar bilan kiring</p><hr class="sep"></div>';
  pane.insertAdjacentHTML('afterbegin', h);
  const enter = async phrase => { key = await deriveKey(phrase, unb64(store.get('cw_salt'))); data = await load(); await ensureTon(phrase); attempts = 0; showMain(); };
  if (hasBio) {
    const bm = t => { const m = $('#bio-msg'); if (m) m.textContent = t; };
    $('#bio-go').onclick = async () => {
      const b = $('#bio-go'); b.disabled = true; b.setAttribute('aria-busy', 'true'); bm('');
      try { await enter(await bioOpen()); return; }
      catch (e) {
        key = null; b.disabled = false; b.removeAttribute('aria-busy');
        if (e && e.name === 'OperationError') { bioWipe(); bm('Face ID kaliti eskirgan va o\'chirildi. Boshqa usul bilan kiring.'); $('#bio-go').hidden = true; }
        else if (e && e.message === 'PRF') bm('Bu qurilma Face ID kalitini bermadi. Boshqa usul bilan kiring.');
        else bm('Face ID tasdiqlanmadi. Qayta urinib ko\'ring yoki boshqa usul bilan kiring.');
      }
    };
  }
  if (!hasPin) return;
  const inp = $('#pin-in'), say = t => { $('#pin-msg').textContent = t; };
  const go = async () => {
    const pin = inp.value;
    if (pw ? !pin : !/^\d{6,12}$/.test(pin)) return say(pw ? 'Parolni kiriting.' : 'PIN 6 dan 12 gacha raqamdan iborat.');
    $('#pin-go').disabled = true; $('#pin-go').setAttribute('aria-busy', 'true'); inp.removeAttribute('aria-invalid'); say('Tekshirilmoqda...');
    const fails = Number(store.get('cw_pinfail')) || 0;
    if (fails > 0) await sleep(Math.min(fails * 1000, 5000));
    let phrase;
    try { phrase = await pinOpen(pin); }
    catch (e) { $('#pin-go').disabled = false; $('#pin-go').removeAttribute('aria-busy'); return say(e && e.message === 'PEPPER' ? 'Bu PIN faqat o\'rnatilgan Android ilovada ishlaydi. Maxfiy so\'zlar bilan kiring.' : 'Qurilma xotirasi yetmadi. Maxfiy so\'zlar bilan kiring.'); }
    if (phrase) {
      try { await enter(phrase); store.set('cw_pinfail', '0'); return; }
      catch (e) { key = null; pinWipe(); showAuth('import'); return authMsg(nm + ' eskirgan va o\'chirildi. So\'zlar bilan kiring.'); }
    }
    const n = fails + 1;
    if (n >= TRIES) { pinWipe(); showAuth('import'); return authMsg(nm + ' ' + TRIES + ' marta xato kiritildi va o\'chirildi. So\'zlar bilan kiring.'); }
    store.set('cw_pinfail', String(n)); inp.value = ''; $('#pin-go').disabled = false; $('#pin-go').removeAttribute('aria-busy'); inp.setAttribute('aria-invalid', 'true'); say(nm + ' noto\'g\'ri. Qolgan urinish: ' + (TRIES - n));
  };
  $('#pin-go').onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* Xavfsizlik sahifasida: PIN, parol va Face ID ni yoqish va o'chirish */
function paintQuick() {
  const on = pinOn(), bo = bioOn(), parts = [];
  if (on) parts.push(pinType() === 'pw' ? 'Parol' : 'PIN'); if (bo) parts.push('Face ID');
  const s = $('#qk-status'); if (s) s.textContent = parts.length ? 'Yoqilgan: ' + parts.join(', ') : 'Yoqilmagan: PIN, parol yoki Face ID o\'rnating';
  const t = $('#qk-tip'); if (t) t.hidden = !!(on || bo || store.get('cw_qtip'));
}
function initPin() {
  const note = t => { $('#pin-note').textContent = t; }, bnote = t => { $('#bio-note').textContent = t; };
  const paint = async () => {
    paintQuick();
    const on = pinOn(), ty = pinType();
    $('#pin-state').textContent = on ? (ty === 'pw' ? 'Parol yoqilgan. Qulf ochishda parol so\'raladi.' : 'PIN yoqilgan. Qulf ochishda PIN so\'raladi.') : 'PIN yoki parol yoqilmagan. Hozir faqat maxfiy so\'zlar bilan kirasiz.';
    $('#pin-set').textContent = on && ty === 'pin' ? 'PINni almashtirish' : 'PIN o\'rnatish';
    $('#pw-set').textContent = on && ty === 'pw' ? 'Parolni almashtirish' : 'Parol o\'rnatish';
    $('#pin-off').hidden = !on; $('#pin-off').textContent = ty === 'pw' ? 'Parolni o\'chirish' : 'PINni o\'chirish';
    const sup = await bioSupported(), bo = bioOn();
    $('#bio-state').textContent = bo ? 'Face ID / barmoq izi yoqilgan.' : sup ? 'Face ID / barmoq izi yoqilmagan.' : window.HamyonNative ? 'Bu telefonda yuqori xavfsizlik darajali barmoq izi yoki yuz sozlanmagan. Telefon sozlamalarida barmoq izini qo\'shing.' : 'Bu qurilma yoki brauzerda Face ID / barmoq izi bilan kirish mavjud emas.';
    $('#bio-set').disabled = !sup && !bo; $('#bio-set').textContent = bo ? 'Qayta sozlash' : 'Face ID ni yoqish'; $('#bio-off').hidden = !bo;
  };
  const verifyWords = async (nt) => {
    nt('');
    const ph = await ask('Tasdiqlash uchun maxfiy so\'zlaringizni bo\'sh joy bilan ajratib kiriting.', { input: true, secret: true, ok: 'Davom etish' });
    if (ph === null) return null;
    const words = ph.trim().toLowerCase().split(/\s+/);
    if (checkWords(words)) { nt('So\'zlar noto\'g\'ri kiritildi.'); return null; }
    try {
      const k = await deriveKey(words.join(' '), unb64(store.get('cw_salt'))), raw = unb64(store.get('cw_vault'));
      await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, k, raw.slice(12));
    } catch (e) { nt('Bu so\'zlar mavjud hamyonga mos kelmadi.'); return null; }
    return words.join(' ');
  };
  const paintLim = () => { const l = limitUsd(), s = sent24h(), f = x => '$' + x.toLocaleString('en-US', { maximumFractionDigits: 2 }); $('#lim-state').textContent = l === null ? 'Limit o\'chirilgan: istalgan summani yuborish mumkin. Katta summa uchun limitni yoqish tavsiya etiladi.' : 'Oxirgi 24 soatda ko\'pi bilan ' + f(l) + ' yuborish mumkin. Yuborilgan: ' + f(s) + '. Limitdan oshgan yuborish bloklanadi.'; };
  paintLim();
  $('#lim-set').onclick = async () => {
    const ln = t => { $('#lim-note').textContent = t; };
    const phrase = await verifyWords(ln); if (!phrase) return;
    const v = await ask('Kunlik limitni dollarda kiriting (masalan 500). Butunlay o\'chirish uchun "off" deb yozing.', { input: true, ok: 'Saqlash' });
    if (v === null) return;
    const t = v.trim().toLowerCase();
    if (t === 'off') { store.set('cw_limit', 'off'); paintLim(); return ln('Limit o\'chirildi.'); }
    const n = Number(t.replace(',', '.'));
    if (!isFinite(n) || n <= 0 || n > 1e9) return ln('Limit musbat son bo\'lishi kerak (masalan 500) yoki "off".');
    store.set('cw_limit', String(n)); paintLim(); ln('Limit saqlandi.');
  };
  $('#pin-set').onclick = async () => {
    const phrase = await verifyWords(note); if (!phrase) return;
    const p1 = await ask('Yangi PIN kiriting (8-12 raqam). Qancha uzun bo\'lsa, shuncha xavfsiz. 12345678 yoki 00000000 kabi oson PIN qabul qilinmaydi. Katta summa uchun parol yoki maxfiy so\'zlar xavfsizroq.', { input: true, secret: 'pin', ok: 'Davom etish' });
    if (p1 === null) return;
    if (/^\d+$/.test(p1) && pinWeak(p1)) return note('Bu PIN juda oson. Boshqasini tanlang.');
    if (!/^\d{8,12}$/.test(p1)) return note('Yangi PIN 8 dan 12 gacha raqamdan iborat bo\'lishi kerak.');
    if (pinWeak(p1)) return note('Bu PIN juda oson. Boshqasini tanlang.');
    const p2 = await ask('PIN ni qayta kiriting.', { input: true, secret: 'pin', ok: 'Tasdiqlash' });
    if (p2 === null) return;
    if (p1 !== p2) return note('PIN lar bir xil emas. Qaytadan urinib ko\'ring.');
    note('Tayyorlanmoqda...');
    try { if (!(await pinSeal(phrase, p1, 'pin'))) throw new Error('save'); note('PIN o\'rnatildi.'); }
    catch (e) { pinWipe(); note('PIN ni saqlab bo\'lmadi.'); }
    paint();
  };
  $('#pw-set').onclick = async () => {
    const phrase = await verifyWords(note); if (!phrase) return;
    const p1 = await ask('Yangi parol kiriting (kamida 8 belgi, harf, raqam va belgilar mumkin). Uzun va noyob parol xavfsizroq.', { input: true, secret: true, ok: 'Davom etish' });
    if (p1 === null) return;
    if (p1.length < 8) return note('Parol kamida 8 belgidan iborat bo\'lishi kerak.');
    if (p1.length > 128) return note('Parol juda uzun (ko\'pi bilan 128 belgi).');
    if (pwWeak(p1)) return note('Bu parol juda oson. Boshqasini tanlang.');
    if (phrase.split(' ').includes(p1.trim().toLowerCase())) return note('Parol maxfiy so\'zlardan biri bo\'lmasligi kerak.');
    const p2 = await ask('Parolni qayta kiriting.', { input: true, secret: true, ok: 'Tasdiqlash' });
    if (p2 === null) return;
    if (p1 !== p2) return note('Parollar bir xil emas. Qaytadan urinib ko\'ring.');
    note('Tayyorlanmoqda...');
    try { if (!(await pinSeal(phrase, p1, 'pw'))) throw new Error('save'); note('Parol o\'rnatildi.'); }
    catch (e) { pinWipe(); note('Parolni saqlab bo\'lmadi.'); }
    paint();
  };
  $('#pin-off').onclick = async () => {
    const nm = pinType() === 'pw' ? 'Parol' : 'PIN';
    if (await ask(nm + ' o\'chiriladi. Keyingi kirishda maxfiy so\'zlar kerak bo\'ladi.', { ok: 'O\'chirish' })) { pinWipe(); note(nm + ' o\'chirildi.'); paint(); }
  };
  $('#bio-set').onclick = async () => {
    const phrase = await verifyWords(bnote); if (!phrase) return;
    const b = $('#bio-set'); b.disabled = true; b.setAttribute('aria-busy', 'true'); bnote('Qurilma so\'ramoqda: Face ID yoki barmoq izini tasdiqlang (ikki marta so\'ralishi mumkin).');
    try { await bioSeal(phrase); bnote('Face ID yoqildi.'); }
    catch (e) {
      bioWipe();
      bnote(e && e.name === 'NotAllowedError' ? 'Bekor qilindi yoki tasdiqlanmadi.' : e && e.message === 'PRF' ? 'Bu qurilma yoki brauzer Face ID dan kalit olishni qo\'llab-quvvatlamaydi, shuning uchun yoqib bo\'lmadi. PIN yoki parol ishlating.' : 'Face ID ni yoqib bo\'lmadi.');
    }
    b.removeAttribute('aria-busy'); paint();
  };
  $('#bio-off').onclick = async () => {
    if (await ask('Face ID bilan kirish o\'chiriladi. Qurilma sozlamalaridagi kalit qolishi mumkin, lekin hamyonga kirish uchun ishlatilmaydi.', { ok: 'O\'chirish' })) { bioWipe(); bnote('Face ID o\'chirildi.'); paint(); }
  };
  paint();
}

/* ---------- Kontaktlar (manzillar kitobi): data.book ichida, hamyon bilan birga shifrlanadi ---------- */
const CT_FAM = { BTC: 'Bitcoin', EVM: 'Ethereum va ERC-20', TRX: 'Tron', SOL: 'Solana', TON: 'TON' };
const CT_VALID = { BTC: VALID.BTC, EVM: VALID.ETH, TRX: VALID.TRX, SOL: VALID.SOL, TON: { test: a => !!WL.tonInfo(a) } };

function paintContacts() {
  const l = $('#ct-list'); if (!l || !data) return;
  const b = bookOf();
  if (!b.length) { l.innerHTML = '<p class="mut">Hozircha kontakt yo\'q. Quyida qo\'shing yoki pul yuborgandan keyin nom bilan saqlang.</p>'; return; }
  l.innerHTML = '<ul class="ct-list">' + b.map((c, i) => '<li class="ct"><div><b>' + esc(c.name) + '</b><div class="mut">' + esc(CT_FAM[c.family] || c.family) + ' · ' + esc(c.addr.slice(0, 8) + '…' + c.addr.slice(-6))
    + '</div></div><button type="button" class="danger sm" data-i="' + i + '" aria-label="' + esc(c.name) + ' kontaktini o\'chirish">O\'chirish</button></li>').join('') + '</ul>';
}

function initContacts() {
  const note = t => { $('#ct-note').textContent = t; };
  $('#ct-list').onclick = async e => {
    const btn = e.target.closest('button[data-i]'); if (!btn) return;
    const b = bookOf(), i = Number(btn.dataset.i), c = b[i]; if (!c) return;
    if (!(await ask('"' + c.name + '" kontakti o\'chiriladi.', { danger: true, ok: 'O\'chirish' }))) return;
    b.splice(i, 1);
    try { await save(); note('O\'chirildi.'); } catch (err) { b.splice(i, 0, c); note('Saqlab bo\'lmadi: ' + err.message); }
    paintContacts();
  };
  $('#ct-add').onclick = async () => {
    const name = $('#ct-name').value.trim(), fam = $('#ct-fam').value, addr = $('#ct-addr').value.trim(), b = bookOf();
    if (!name) return note('Nom kiriting.');
    if (!addr) return note('Manzilni kiriting.');
    if (looksSecret(addr)) return note('Bu maxfiy kalit yoki so\'zlarga o\'xshaydi! Bu yerga faqat ommaviy manzil kiriting.');
    if (!CT_VALID[fam].test(addr)) return note('Manzil ' + CT_FAM[fam] + ' tarmog\'iga mos emas. Tarmoqni va manzilni tekshiring.');
    if (b.some(c => c.family === fam && sameAddr(c.addr, addr, fam))) return note('Bu manzil allaqachon saqlangan.');
    if (b.length >= 200) return note('Kontaktlar soni chegaraga yetdi (200).');
    const alike = b.find(c => c.family === fam && looksAlike(c.addr, addr));
    if (alike && !(await ask('Bu manzil "' + alike.name + '" manziliga juda o\'xshash, lekin farq qiladi. Bu manzil zaharlash firibgarligi bo\'lishi mumkin. Baribir saqlaysizmi?', { danger: true, ok: 'Ha, saqlash' }))) return;
    b.push({ addr, family: fam, name });
    try { await save(); $('#ct-name').value = ''; $('#ct-addr').value = ''; note('Saqlandi.'); }
    catch (err) { b.pop(); note('Saqlab bo\'lmadi: ' + err.message); }
    paintContacts();
  };
  paintContacts();
}

/* ---------- Qo'shimcha ERC-20 tokenlar: USDC va DAI (Ethereum) ----------
   Kontrakt manzillari Etherscan orqali tekshirilgan (nom, decimals, EIP-55 nazorat yig'indisi). USDT shu ro'yxatga kiritilgan. */

const POPULAR = ['POL', 'AVAX', 'BNB', 'ETH_ARB', 'ETH_OP', 'USDT_ERC20', 'USDT_TRC20', 'USDT_SOLANA', 'USDT_TON', 'USDT_POLYGON', 'USDT_ARBITRUM', 'USDT_OPTIMISM', 'USDT_AVALANCHE', 'USDT_BSC',
  'USDC_ERC20', 'USDC_TRC20', 'USDC_SOLANA', 'USDC_POLYGON', 'USDC_ARBITRUM', 'USDC_OPTIMISM', 'USDC_AVALANCHE', 'USDC_BSC', 'WBTC_ERC20', 'LINK_ERC20', 'UNI_ERC20', 'DAI_ERC20', 'SHIB_ERC20', 'AAVE_ERC20', 'PEPE_ERC20', 'LDO_ERC20', 'CRV_ERC20'];
const baseItems = k => data.items.filter(x => x.kind === 'addr' && x.coin === ADDBASE(k) && x.src === 'phrase');
const hasBase = id => id === 'BTC' ? data.items.some(x => x.coin === 'BTC') : id === 'OTH' ? false : data.items.some(x => x.kind === 'addr' && x.src === 'phrase' && x.coin === (id === 'TRX' ? 'TRX' : id === 'SOL' ? 'SOL' : id === 'TON' ? 'TON' : 'ETH'));
const offerFor = id => POPULAR.filter(k => NETOF[k] === id && ADDBASE(k) && baseItems(k).some(b => !data.items.some(y => y.coin === k && String(y.address).toLowerCase() === String(b.address).toLowerCase())));
const optLabel = k => COINS[k].sym + (NATK.has(k) ? ' (tarmoq tangasi)' : SPL[k] || k === 'USDT_TON' ? ' (faqat qabul qilish)' : k === 'USDC_BSC' ? ' (Binance-Peg)' : '');
const viewGroups = () => { const have = groupNets(data.items); return NETG.map(([id, name]) => have.find(g => g.id === id) || { id, name, items: [] }).filter(g => g.items.length || (g.id !== 'OTH' && hasBase(g.id) && offerFor(g.id).length)); };
const TOK_ALL = [...Object.keys(ERC20).filter(x => x !== 'USDT_ERC20'), ...Object.keys(NATIVE), 'USDC_TRC20', 'USDT_SOLANA', 'USDC_SOLANA', 'USDT_TON'];

/* Mavjud manzillarga tangalar va tokenlar qo'shish (yangi manzil kerak emas): Qo'shish sahifasi va har bir tarmoq bo'limidagi tanlov */
async function addTokens(keys, say) {
  const n0 = data.items.length, miss = new Set(); let added = 0;
  for (const k of keys) {
    const bc = ADDBASE(k);
    const base = data.items.filter(x => x.kind === 'addr' && x.coin === bc && x.src === 'phrase');
    if (!base.length) { miss.add(bc === 'SOL' ? 'Solana' : bc === 'TRX' ? 'Tron' : bc === 'TON' ? 'TON' : 'Ethereum'); continue; }
    base.filter(x => !data.items.some(y => y.coin === k && String(y.address).toLowerCase() === x.address.toLowerCase()))
      .forEach(x => { data.items.push({ id: uid(), kind: 'addr', coin: k, label: x.label, address: x.address, src: 'phrase' }); added++; });
  }
  if (!added) return say(miss.size ? [...miss].join(', ') + ' manzili topilmadi.' : 'Tanlangan aktiv allaqachon qo\'shilgan.');
  try { await save(); } catch (e) { data.items.length = n0; return say('Saqlab bo\'lmadi: ' + e.message); }
  say((keys.length === 1 ? COINS[keys[0]].sym + ' (' + (NET_NAMES[keys[0]] || '') + ') qo\'shildi.' : added + ' ta aktiv qo\'shildi.') + ' Balans yangilanmoqda...' + (miss.size ? ' (' + [...miss].join(', ') + ' manzili yo\'q: maxfiy so\'zlar bilan kirganda avtomatik qo\'shiladi.)' : ''));
  updateView(); refresh();
}
function initTokens() {
  let adNet = 'ETH', adSel = null, selTouched = false;
  const GC = { ETH: 'ETH', TRX: 'TRX', SOL: 'SOL', TON: 'TON', POLY: 'ETH', ARB: 'ETH', OP: 'ETH', AVAX: 'ETH', BSC: 'ETH' };
  const shortNet = n => n.replace(' One', '').replace(' C-Chain', '');
  const isDone = k => baseItems(k).length > 0 && !offerFor(NETOF[k]).includes(k);
  const paintAdd = () => {
    if (!data || !$('#ad-nets')) return;
    const nets = NETG.filter(([id]) => id !== 'BTC' && id !== 'OTH' && POPULAR.some(k => NETOF[k] === id && ADDBASE(k)));
    if (!nets.some(n => n[0] === adNet)) adNet = nets.length ? nets[0][0] : 'ETH';
    $('#ad-nets').innerHTML = nets.map(([id, name]) => { const sy = GC[id] || 'ETH';
      return '<button type="button" class="tile" role="radio" aria-checked="' + (id === adNet) + '" data-n="' + id + '"><span class="ti" aria-hidden="true" style="--c:' + (CCOL[sy] || 'var(--coin-other)') + '">' + (GLYPH[sy] || esc(name.slice(0, 1))) + '</span>' + esc(shortNet(name)) + '</button>'; }).join('');
    const keys = POPULAR.filter(k => NETOF[k] === adNet && ADDBASE(k));
    if (adSel && !keys.includes(adSel)) adSel = null;
    if (adSel && isDone(adSel)) adSel = null;
    $('#ad-list').innerHTML = keys.map(k => { const sym = COINS[k].sym, done = isDone(k), nob = baseItems(k).length === 0;
      const st = done ? '<span class="st">✓ Qo\'shilgan</span>' : nob ? '<span class="st">Manzil yo\'q</span>' : '<span class="st">' + (adSel === k ? '✓ Tanlangan' : 'Tanlash') + '</span>';
      return '<button type="button" class="addrow' + (done ? ' done' : '') + (nob ? ' nob' : '') + '" data-k="' + k + '" aria-pressed="' + (adSel === k) + '"' + (done || nob ? ' aria-disabled="true"' : '') + ' aria-label="' + esc(sym + ' ' + optLabel(k) + (done ? ', qo\'shilgan' : nob ? ', manzil yo\'q' : '')) + '"><span class="ci" aria-hidden="true" style="--c:' + (CCOL[sym] || 'var(--coin-other)') + '">' + (GLYPH[sym] || esc(String(sym).slice(0, 1))) + '</span><span class="a-t"><span class="a-n">' + esc(String(COINS[k].name || sym).split(' (')[0]) + '</span><span class="a-s">' + esc(sym + ' · ' + shortNet(((NETG.find(n => n[0] === adNet)) || ['', ''])[1])) + '</span></span>' + st + '</button>'; }).join('');
    const rest = keys.filter(k => !isDone(k) && baseItems(k).length > 0);
    $('#ad-all').hidden = rest.length < 2;
    $('#tk-add').textContent = adSel ? COINS[adSel].sym + ' ni qo\'shish' : 'Qo\'shish';
  };
  PAINTADD = paintAdd; paintAdd();
  $('#tk-sel').addEventListener('change', () => { selTouched = true; });
  $('#ad-nets').addEventListener('click', e => { const t = e.target.closest('button.tile'); if (!t) return; adNet = t.dataset.n; adSel = null; paintAdd(); const nb = document.querySelector('#ad-nets .tile[data-n="' + adNet + '"]'); if (nb) nb.focus(); });
  $('#ad-list').addEventListener('click', e => { const r = e.target.closest('button.addrow'); if (!r || r.getAttribute('aria-disabled') === 'true') return; adSel = adSel === r.dataset.k ? null : r.dataset.k; paintAdd(); const nb = document.querySelector('#ad-list .addrow[data-k="' + r.dataset.k + '"]'); if (nb) nb.focus(); });
  $('#ad-all').onclick = () => { const keys = POPULAR.filter(k => NETOF[k] === adNet && ADDBASE(k) && baseItems(k).length && !isDone(k)); if (keys.length) { adSel = null; addTokens(keys, t => { $('#tk-msg').textContent = t; }); } };
  $('#tk-add').onclick = () => {
    if (adSel) { const k = adSel; adSel = null; return addTokens([k], t => { $('#tk-msg').textContent = t; }); }
    if (!selTouched) { $('#tk-msg').textContent = 'Avval ro\'yxatdan aktivni tanlang.'; return; }
    const sel = $('#tk-sel').value, keys = sel === 'ALL' ? TOK_ALL : [sel];
    if (!keys.every(k => ADDBASE(k))) return;
    return addTokens(keys, t => { $('#tk-msg').textContent = t; });
  };
  const sheetKey = e => {
    const sh = $('#tk-sheet'); if (!sh) return;
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
    if (e.key !== 'Tab') return;
    const f = [...sh.querySelectorAll('button,input')].filter(x => !x.closest('[hidden]') && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  const closeSheet = () => {
    const s = $('#tk-sheet'); if (!s) return;
    const net = s.dataset.net, row = s.dataset.row; s.remove(); document.removeEventListener('keydown', sheetKey);
    const b = (row && document.querySelector('#list [data-act="menu"][data-id="' + row + '"]')) || document.querySelector('#list .ngb[data-net="' + net + '"]') || $('#nav-assets'); if (b) b.focus();
  };
  const openRowMenu = rid => {
    const it = data && data.items.find(x => x.id === rid); if (!it || $('#tk-sheet')) return;
    const nm = nameOf(it);
    const ic = d => '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + d + '</svg>';
    const items = [];
    if (it.kind === 'addr') items.push(['addr', 'Ochish', ic('<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>'), '']);
    if (it.kind === 'manual') items.push(['edit', 'Tahrirlash', ic('<path d="M4 20h4L19 9l-4-4L4 16z"/>'), '']);
    items.push(['del', 'O\'chirish', ic('<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/>'), ' dng']);
    const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'tk-sheet'; bg.dataset.net = ''; bg.dataset.row = rid;
    bg.innerHTML = '<div class="sheet row-sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grab" aria-hidden="true"></div><div class="sheet-h"><div><h2 id="sh-t">' + esc(nm) + '</h2><div class="mut">' + esc(symOf(it)) + '</div></div><button type="button" class="ib" id="sh-x" aria-label="Yopish"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' + items.map(([a, l, s, c]) => '<button type="button" class="rs' + c + '" data-m="' + a + '">' + s + l + '</button>').join('') + '</div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
    $('#sh-x').onclick = closeSheet;
    bg.querySelectorAll('button.rs').forEach(b => b.onclick = () => { const a = b.dataset.m; closeSheet(); ROWACT({ dataset: { act: a, id: rid } }); });
    document.addEventListener('keydown', sheetKey);
    bg.querySelector('button.rs').focus();
  };
  const openSheet = id => {
    if (!data || $('#tk-sheet')) return;
    const offs = offerFor(id).filter(k => POPULAR.includes(k) && ADDBASE(k)); if (!offs.length) return;
    const name = (NETG.find(n => n[0] === id) || [id, id])[1];
    const rows = offs.map(k => { const sym = COINS[k].sym;
      return '<li data-s="' + esc((sym + ' ' + optLabel(k)).toLowerCase()) + '"><span class="ci" aria-hidden="true" style="--c:' + (CCOL[sym] || 'var(--coin-other)') + '">' + (GLYPH[sym] || esc(String(sym).slice(0, 1))) + '</span><span class="a-t"><span class="a-n">' + esc(sym) + '</span><span class="a-s">' + esc(optLabel(k)) + '</span></span><button type="button" class="sec" data-k="' + k + '" aria-label="' + esc(sym + ' ' + optLabel(k) + ' qo\'shish') + '">Qo\'shish</button></li>'; }).join('');
    const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'tk-sheet'; bg.dataset.net = id;
    bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grab" aria-hidden="true"></div><div class="sheet-h"><div><h2 id="sh-t">Token qo\'shish</h2><div class="mut">' + esc(name) + '</div></div><button type="button" class="ib" id="sh-x" aria-label="Yopish"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><label class="sr" for="sh-q">Token qidirish</label><input id="sh-q" type="search" placeholder="Nom yoki belgi bo\'yicha qidirish" autocomplete="off"><ul class="sheet-l" id="sh-l">' + rows + '</ul><div class="mut" id="sh-e" hidden>Hech narsa topilmadi.</div></div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
    $('#sh-x').onclick = closeSheet;
    $('#sh-q').addEventListener('input', e => {
      const q = e.target.value.trim().toLowerCase(); let n = 0;
      bg.querySelectorAll('#sh-l li').forEach(li => { const ok = !q || li.dataset.s.includes(q); li.hidden = !ok; if (ok) n++; });
      $('#sh-e').hidden = n > 0;
    });
    $('#sh-l').addEventListener('click', e => {
      const b = e.target.closest('button[data-k]'); if (!b) return;
      const k = b.dataset.k; if (!POPULAR.includes(k) || !ADDBASE(k)) return;
      closeSheet(); addTokens([k], t => { $('#ng-msg').textContent = t; });
    });
    document.addEventListener('keydown', sheetKey);
    $('#sh-x').focus();
  };
  $('#net-chips').addEventListener('click', e => { const c = e.target.closest('button.chip'); if (!c) return; NETF = c.dataset.f; updateView(); const nb = document.querySelector('#net-chips .chip[data-f="' + NETF + '"]'); if (nb) nb.focus(); });
  $('#list').addEventListener('click', e => {
    const mb = e.target.closest('button[data-act=menu]'); if (mb) { openRowMenu(mb.dataset.id); return; }
    const h = e.target.closest('button.ngh');
    if (h) { const id = h.dataset.net; if (COLL.has(id)) COLL.delete(id); else COLL.add(id); saveColl(); updateView(); const nb = document.querySelector('#list .ngh[data-net="' + id + '"]'); if (nb) nb.focus(); return; }
    const b = e.target.closest('button.ngb'); if (b) openSheet(b.dataset.net);
  });
}

/* ---------- QR: to'lov havolasini tahlil qilish va kamera orqali skanerlash ---------- */
function parsePayUri(t, coin) {
  t = String(t || '').trim(); const out = { addr: t, amount: '', memo: '' };
  const m = /^([a-z][a-z0-9+.-]*):([\s\S]*)$/i.exec(t);
  if (m) {
    let rest = m[2].replace(/^\/\//, ''), q = '';
    const qi = rest.indexOf('?'); if (qi >= 0) { q = rest.slice(qi + 1); rest = rest.slice(0, qi); }
    out.addr = rest.replace(/^(transfer|pay)[\/-]/i, '').replace(/@.*$/, '').replace(/\/.*$/, '');
    let sp; try { sp = new URLSearchParams(q); } catch (e) { sp = new URLSearchParams(); }
    if (famOf(coin) === 'BTC' && /^\d+(\.\d{1,8})?$/.test(sp.get('amount') || '')) out.amount = sp.get('amount');
    if (coin === 'TON' && sp.get('text')) out.memo = sp.get('text').slice(0, 100);
  }
  return out;
}
const canScanQr = () => !!(window.isSecureContext && window.BarcodeDetector && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
async function scanQr(cb) {
  if (document.getElementById('qr-scan')) return;
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'qr-scan';
  bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="qr-t"><div class="grab" aria-hidden="true"></div><div class="sheet-h"><h2 id="qr-t">QR kodni skanerlang</h2><button type="button" class="ib" id="qr-x" aria-label="Yopish"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><video id="qr-v" class="qrv" playsinline muted></video><p class="mut" id="qr-m" role="status">Kamera ochilmoqda...</p></div>';
  document.body.appendChild(bg);
  let stream = null, alive = true, tm = 0;
  const onKey = e => { if (e.key === 'Escape') close(); };
  const close = () => { alive = false; clearTimeout(tm); if (stream) stream.getTracks().forEach(t => t.stop()); bg.remove(); document.removeEventListener('keydown', onKey); const b = document.getElementById('sd-scan'); if (b) b.focus(); };
  document.addEventListener('keydown', onKey);
  $('#qr-x').onclick = close; bg.addEventListener('click', e => { if (e.target === bg) close(); });
  $('#qr-x').focus();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    if (!alive) { stream.getTracks().forEach(t => t.stop()); return; }
    const v = $('#qr-v'); v.srcObject = stream; await v.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    $('#qr-m').textContent = 'QR kodni kameraga qarating.';
    const tick = async () => {
      if (!alive) return;
      try { const r = await det.detect(v); if (r && r[0] && r[0].rawValue) { const val = String(r[0].rawValue).slice(0, 500); close(); cb(val); return; } } catch (e) { /* keyingi kadr */ }
      tm = setTimeout(tick, 250);
    };
    tick();
  } catch (e) { const mm = $('#qr-m'); if (mm) mm.textContent = 'Kameradan foydalanib bo\'lmadi. Brauzerda kameraga ruxsat bering yoki manzilni qo\'lda kiriting.'; }
}

/* ---------- Qulflash ---------- */
function lock() {
  key = null; data = null; balances = {}; prices = {}; lastUpdate = null; PANEL = null; routeHandler = null; routeGo = null; MN = null;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  clearInterval(refreshTimer); clearTimeout(idleTimer); clearTimeout(warnTimer); hideLockWarn();
  showAuth('import');
}
function hideLockWarn() { const d = document.getElementById('lockwarn'); if (d) d.remove(); }
function showLockWarn() {
  if (!key || document.getElementById('lockwarn')) return;
  const d = document.createElement('div'); d.id = 'lockwarn'; d.className = 'toast'; d.setAttribute('role', 'alert');
  d.textContent = '30 soniyadan keyin hamyon qulflanadi. Davom etish uchun sichqonchani siljiting yoki biror tugmani bosing.';
  document.body.appendChild(d);
}
let lastActive = Date.now();
function bump() {
  lastActive = Date.now();
  clearTimeout(idleTimer); clearTimeout(warnTimer); hideLockWarn();
  if (key) { warnTimer = setTimeout(showLockWarn, 4.5 * 60 * 1000); idleTimer = setTimeout(lock, 5 * 60 * 1000); }
}
let lastBump = 0;
['click', 'keydown', 'mousemove', 'touchstart'].forEach(ev => addEventListener(ev, () => { const n = Date.now(); if (n - lastBump >= 1000) { lastBump = n; bump(); } }, { passive: true }));
let hideTimer = null, hiddenAt = 0;
const IDLE_MS = 5 * 60 * 1000;
/* Taymerlar uyqu rejimida to'xtaydi, shuning uchun mutlaq vaqt (Date.now) bilan ham tekshiramiz. */
function lockCheck() {
  if (!key) return;
  const n = Date.now();
  if (n - lastActive >= IDLE_MS || (hiddenAt && n - hiddenAt >= HIDE_LOCK_MS)) lock();
}
document.addEventListener('visibilitychange', () => {
  clearTimeout(hideTimer);
  if (document.hidden) { if (key) { hiddenAt = Date.now(); hideTimer = setTimeout(() => { if (key) lock(); }, HIDE_LOCK_MS); } }
  else { lockCheck(); hiddenAt = 0; }
});
setInterval(lockCheck, 10000);
addEventListener('pageshow', lockCheck); addEventListener('focus', lockCheck);

/* ---------- Router tinglovchilari (bir marta) ---------- */
addEventListener('hashchange', () => { if (routeHandler) routeHandler(); });
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (a && routeGo) { e.preventDefault(); routeGo(a.getAttribute('href').slice(2)); }
});

/* ---------- Boshlash ---------- */
if (!window.crypto || !crypto.subtle) {
  app.innerHTML = '<div class="center card"><h1>Brauzer mos emas</h1><p class="mut">Shifrlash uchun yangi Chrome, Firefox yoki Safari kerak.</p></div>';
} else if (store.get('cw_vault') && store.get('cw_salt')) {
  if (store.get('cw_ver') === '3') showAuth('import'); else showLegacy();
} else showAuth('create');

if ('serviceWorker' in navigator && !window.HamyonNative) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
